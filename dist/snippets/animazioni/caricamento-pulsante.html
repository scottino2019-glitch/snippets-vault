<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e242c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #374353;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner-label {
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="spinner-box">
    <div class="spinner"></div>
    <span class="spinner-label">Elaborazione in corso...</span>
  </div>
</body>
</html>
