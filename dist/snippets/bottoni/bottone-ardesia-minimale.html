<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e242c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .btn-outline {
      padding: 12px 26px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      background: transparent;
      border: 1px solid #475569;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-outline:hover {
      border-color: #2dd4bf;
      color: #2dd4bf;
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.2);
    }
  </style>
</head>
<body>
  <button class="btn-outline">Scopri Dettagli</button>
</body>
</html>
