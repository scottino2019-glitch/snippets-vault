<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #1e242c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .grid-item {
      background: #272f3a;
      border: 1px solid #374353;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
    }
    .grid-item span {
      display: block;
      font-size: 24px;
      margin-bottom: 8px;
      color: #6366f1;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid-item">
      <span>01</span>
      Layout Flessibile
    </div>
    <div class="grid-item">
      <span>02</span>
      Auto Responsive
    </div>
    <div class="grid-item">
      <span>03</span>
      Zero Dipendenze
    </div>
    <div class="grid-item">
      <span>04</span>
      Grid CSS Moderno
    </div>
  </div>
</body>
</html>
