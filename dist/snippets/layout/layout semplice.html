<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Layout CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
        }
        main {
            display: flex;
        }
        article {
            flex: 3;
            padding: 20px;
        }
        aside {
            flex: 1;
            padding: 20px;
            background: #f4f4f4;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🌟 Il mio sito</h1>
    </header>
    <main>
        <article>
            <h2>Contenuto principale</h2>
            <p>Testo e immagini vanno qui...</p>
        </article>
        <aside>
            <h3>Sidebar</h3>
            <p>Contenuti extra...</p>
        </aside>
    </main>
    <footer>
        <p>&copy; 2024 Il mio sito</p>
    </footer>
</body>
</html>
