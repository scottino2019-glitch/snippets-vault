<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto Tailwind CSS</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  
  <meta charset="UTF-8">
  

  <style>
    /* Nasconde tutte le sezioni */
    section {
      display: none;
      padding: 20px;
    }

    /* Mostra solo la sezione che ha la classe "active" sfumandola */
    section.active {
      display: block;
      animation: dissolvenza 0.3s ease-in;
    }

    @keyframes dissolvenza {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Stile semplice per il menù */
    nav button {
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>


  <!-- Tailwind CSS Config -->
  <script>
    
window.tailwind = window.tailwind || {};
window.module = window.module || { exports: {} };
window.exports = window.exports || {};
try {
  // Configurazione Tailwind
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: '#0ea5e9',
      }
    }
  }
}
  if (window.module && window.module.exports && Object.keys(window.module.exports).length > 0) {
    window.tailwind.config = window.module.exports;
  }
} catch(e) {
  console.warn('Errore esecuzione tailwind.config:', e.message);
}
    if (window.tailwind && window.tailwind.config && !window.tailwind.config.darkMode) {
      window.tailwind.config.darkMode = 'class';
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>

  <!-- Custom CSS & Tailwind Directives -->
  
</head>
<body class="bg-[#0b0f19] text-[#f1f5f9] min-h-screen ">


  <nav>
    <button onclick="cambiaSezione('home')">Home</button>
    <button onclick="cambiaSezione('chi-siamo')">Chi Siamo</button>
    <button onclick="cambiaSezione('servizi')">Servizi</button>
  </nav>

  <section id="home" class="active">
    <h1>Home Page</h1>
    <p>Benvenuto! Questa è la prima sezione visibile.</p>
    <button onclick="cambiaSezione('servizi')">Vai ai Servizi</button>
  </section>

  <section id="chi-siamo">
    <h1>Chi Siamo</h1>
    <p>Qui puoi inserire la descrizione della tua attività.</p>
  </section>

  <section id="servizi">
    <h1>I Nostri Servizi</h1>
    <p>Qui c'è la lista dei tuoi servizi.</p>
    <button onclick="cambiaSezione('home')">Torna alla Home</button>
  </section>

  <script>
    function cambiaSezione(idDaMostrare) {
      // Passaggio A: Nasconde tutte le sezioni esistenti
      const tutteLeSezioni = document.querySelectorAll('section');
      tutteLeSezioni.forEach(sec => sec.classList.remove('active'));

      // Passaggio B: Rende visibile solo la sezione richiesta
      const sezioneScelta = document.getElementById(idDaMostrare);
      sezioneScelta.classList.add('active');
    }
  </script>




</body>
</html>
