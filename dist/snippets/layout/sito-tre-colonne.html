<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Nome del sito</title>

}

.col {

.col1 {
  background-color: #F1C40F;
}

.col2 {
  background-color: #1ABC9C;
}

.col3 {

}

header, footer {
  background-color: #2C3E50;
  color: white;
  padding: 10px;
  text-align: center;
}

header h1, footer p {
  margin: 0;
}
</style>
</head>
<body>
  <header>
    <h1>Nome del sito</h1>
  </header>
  
  <div class="container">
    <div class="col col1">
      <h2>Colonna 1</h2>
      <p>Testo colonna 1</p>
    </div>
    <div class="col col2">
      <h2>Colonna 2</h2>
      <p>Testo colonna 2</p>
    </div>
    <div class="col col3">
      <h2>Colonna 3</h2>
      <p>Testo colonna 3</p>
    </div>
  </div>

  <footer>
    <p>© Anno del sito - Nome del sito</p>
  </footer>

</body>
</html>
