<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .navbar {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: #0f172a;
      text-decoration: none;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 16px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      list-style: none;
    }
    .nav-item {
      position: relative;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .nav-link:hover, .nav-item:hover > .nav-link {
      color: #0284c7;
      background: #f0f9ff;
    }
    .nav-link.active {
      color: #0284c7;
      background: #e0f2fe;
      font-weight: 600;
    }
    /* Dropdown */
    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 8px;
      width: 240px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: all 0.2s ease;
      z-index: 50;
    }
    .nav-item:hover .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      transition: background 0.15s;
    }
    .dropdown-item:hover {
      background: #f8fafc;
      color: #0284c7;
    }
    .item-tag {
      font-size: 10px;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .nav-cta {
      background: #0284c7;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
    }
    .nav-cta:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="#" class="nav-brand">
      <div class="brand-icon">❖</div>
      <span>StudioNav</span>
    </a>
    <ul class="nav-links">
      <li class="nav-item">
        <a href="#" class="nav-link active">Home</a>
      </li>
      <li class="nav-item">
        <div class="nav-link">
          <span>Prodotti</span>
          <span style="font-size: 10px;">▼</span>
        </div>
        <div class="dropdown-menu">
          <a href="#" class="dropdown-item">
            <span>Editor Componenti</span>
            <span class="item-tag">Pro</span>
          </a>
          <a href="#" class="dropdown-item">
            <span>Libreria Layout</span>
          </a>
          <a href="#" class="dropdown-item">
            <span>Generatore Icone</span>
            <span class="item-tag">Nuovo</span>
          </a>
          <a href="#" class="dropdown-item">
            <span>Esportatore HTML/CSS</span>
          </a>
        </div>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link">Documentazione</a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link">Prezzi</a>
      </li>
    </ul>
    <button class="nav-cta" onclick="alert('Accesso alla console di navigazione!')">Inizia Ora</button>
  </nav>
</body>
</html>
