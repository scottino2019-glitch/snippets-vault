<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda ad Anelli Filofax - Componente Tailwind CSS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-[#faf9f6] text-stone-900 min-h-screen flex items-center justify-center p-6 sm:p-12">

<!-- =========================================================================
     AGENDA FILOFAX IN PELLE (HTML + TAILWIND CSS + VANILLA JS)
     Anelli meccanici apribili, visualizzatore impegni, aggiunta nuovi appuntamenti,
     bottoni di conferma RSVP e promemoria notifiche
     ========================================================================= -->
<div id="agenda-card" class="max-w-md w-full select-none flex flex-col items-center justify-center p-2 relative">
  <!-- Raccoglitore in Pelle con Anelli Laterali -->
  <div class="w-full rounded-2xl p-4 shadow-2xl relative border-2 bg-[#291f19] border-[#4f382a] text-stone-100">
    <!-- 4 Angolari d'Ottone Decorativi -->
    <div class="absolute top-0 left-0 w-6 h-6 border-t-2 border-l-2 border-amber-400/80 rounded-tl-xl pointer-events-none">
      <div class="w-1.5 h-1.5 rounded-full bg-amber-400 m-1"></div>
    </div>
    <div class="absolute top-0 right-0 w-6 h-6 border-t-2 border-r-2 border-amber-400/80 rounded-tr-xl pointer-events-none">
      <div class="w-1.5 h-1.5 rounded-full bg-amber-400 m-1 ml-auto"></div>
    </div>
    <div class="absolute bottom-0 left-0 w-6 h-6 border-b-2 border-l-2 border-amber-400/80 rounded-bl-xl pointer-events-none">
      <div class="w-1.5 h-1.5 rounded-full bg-amber-400 m-1 mt-auto"></div>
    </div>
    <div class="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 border-amber-400/80 rounded-br-xl pointer-events-none">
      <div class="w-1.5 h-1.5 rounded-full bg-amber-400 m-1 ml-auto mt-auto"></div>
    </div>

    <!-- 6 Anelli Metallici sul Dorso Sinistro -->
    <div id="binder-rings" title="Clicca per aprire / chiudere gli anelli!" class="absolute top-8 bottom-8 left-1.5 w-5 flex flex-col justify-between items-center z-30 cursor-pointer pointer-events-auto">
      <div class="ring-mech w-4 h-3 rounded-r-full bg-gradient-to-r from-stone-400 via-amber-200 to-stone-300 border-y border-r border-stone-600 shadow-md transition-transform"></div>
      <div class="ring-mech w-4 h-3 rounded-r-full bg-gradient-to-r from-stone-400 via-amber-200 to-stone-300 border-y border-r border-stone-600 shadow-md transition-transform"></div>
      <div class="ring-mech w-4 h-3 rounded-r-full bg-gradient-to-r from-stone-400 via-amber-200 to-stone-300 border-y border-r border-stone-600 shadow-md transition-transform"></div>
      <div class="ring-mech w-4 h-3 rounded-r-full bg-gradient-to-r from-stone-400 via-amber-200 to-stone-300 border-y border-r border-stone-600 shadow-md transition-transform"></div>
      <div class="ring-mech w-4 h-3 rounded-r-full bg-gradient-to-r from-stone-400 via-amber-200 to-stone-300 border-y border-r border-stone-600 shadow-md transition-transform"></div>
      <div class="ring-mech w-4 h-3 rounded-r-full bg-gradient-to-r from-stone-400 via-amber-200 to-stone-300 border-y border-r border-stone-600 shadow-md transition-transform"></div>
    </div>

    <!-- Foglio Interno Avorio con Fori Perforati -->
    <div class="ml-4 rounded-xl bg-gradient-to-br from-[#faf7ed] via-[#f5eedc] to-[#ebe0c8] border border-[#d6c7a7] p-4 text-stone-900 shadow-inner relative">
      <!-- Intestazione Data con Calendario e Tasto Aggiungi Impegno -->
      <div class="flex items-center justify-between border-b border-[#d8c8a8] pb-2.5 mb-2.5">
        <div class="flex items-center gap-2.5">
          <div class="w-12 h-13 rounded-lg flex flex-col items-center overflow-hidden shrink-0 shadow-sm border border-[#c8b693]">
            <div class="w-full bg-rose-700 text-white text-[8px] font-black tracking-widest text-center py-0.5 uppercase">
              OTTOBRE
            </div>
            <div class="w-full flex-1 bg-white flex items-center justify-center text-lg font-black text-stone-900">
              24
            </div>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
              <span id="events-count-label" class="text-xs font-bold text-emerald-800">2 Impegni Programmati</span>
            </div>
            <p class="text-[11px] font-mono text-stone-600">Giovedì • Planner Filofax</p>
          </div>
        </div>

        <button id="toggle-add-btn" type="button" class="px-2.5 py-1.5 rounded-lg bg-amber-900 hover:bg-amber-800 text-amber-100 font-mono text-xs font-bold flex items-center gap-1 shadow-sm cursor-pointer">
          <span id="toggle-add-icon">+</span>
          <span id="toggle-add-text">Nuovo</span>
        </button>
      </div>

      <!-- Modulo per Aggiungere Nuovo Impegno (Nascosto di default, espandibile) -->
      <div id="add-event-form" class="hidden mb-3 p-3 rounded-xl bg-[#ede2c8] border border-[#cfbe9e]">
        <div class="text-xs font-bold text-amber-950 mb-2 font-serif">Aggiungi Nuovo Impegno:</div>
        <div class="space-y-2">
          <input id="new-event-title" type="text" placeholder="Titolo appuntamento..." class="w-full px-2.5 py-1.5 rounded-lg bg-white border border-[#c8b693] text-xs text-stone-900 focus:outline-none" />
          <div class="grid grid-cols-2 gap-2">
            <input id="new-event-time" type="text" placeholder="Orario (es. 16:30)" class="w-full px-2 py-1 rounded-lg bg-white border border-[#c8b693] text-xs text-stone-900 focus:outline-none" />
            <input id="new-event-location" type="text" placeholder="Luogo (es. Google Meet)" class="w-full px-2 py-1 rounded-lg bg-white border border-[#c8b693] text-xs text-stone-900 focus:outline-none" />
          </div>
          <div class="flex justify-end gap-2 pt-1">
            <button id="cancel-add-btn" type="button" class="px-2 py-1 text-xs text-stone-600 hover:text-stone-900 cursor-pointer">Annulla</button>
            <button id="save-event-btn" type="button" class="px-3 py-1 rounded-lg bg-emerald-800 hover:bg-emerald-700 text-white text-xs font-bold shadow-xs cursor-pointer">+ Salva</button>
          </div>
        </div>
      </div>

      <!-- Lista / Timeline Impegni Cliccabili -->
      <div class="mb-3">
        <span class="text-[9px] font-mono font-bold text-stone-500 uppercase tracking-wider block mb-1">PROGRAMMA GIORNALIERO:</span>
        <div id="events-timeline" class="flex gap-1.5 overflow-x-auto pb-1">
          <button type="button" data-id="1" class="event-pill px-2.5 py-1.5 rounded-lg bg-[#291f19] text-amber-100 font-mono text-xs font-bold border border-amber-900 shrink-0 cursor-pointer text-left">
            <span class="block text-[9px] text-amber-400">09:30 - 10:00</span>
            <span class="block truncate max-w-[120px]">Daily Standup</span>
          </button>
          <button type="button" data-id="2" class="event-pill px-2.5 py-1.5 rounded-lg bg-white/70 hover:bg-white text-stone-800 font-mono text-xs border border-[#cfbe9e] shrink-0 cursor-pointer text-left">
            <span class="block text-[9px] text-red-600 font-bold">14:30 - 15:30 ★</span>
            <span class="block truncate max-w-[120px]">Review Design</span>
          </button>
        </div>
      </div>

      <!-- Dettaglio Impegno Attivo -->
      <div id="active-event-details" class="p-3 rounded-xl bg-white/70 border border-[#d8c8a8] mb-3">
        <div class="flex items-center justify-between mb-1">
          <span id="active-tag" class="px-2 py-0.5 rounded bg-emerald-100 border border-emerald-300 text-emerald-800 font-mono text-[9px] font-black uppercase">
            CONFERMATO
          </span>
          <span id="active-time" class="text-xs font-mono font-bold text-stone-600">09:30 - 10:00</span>
        </div>
        <h3 id="active-title" class="font-serif font-black text-base text-[#291e17] leading-tight mt-1">
          Daily Standup Design & Dev
        </h3>
        <p id="active-location" class="text-xs text-stone-600 mt-1 flex items-center gap-1">
          📍 Google Meet • meet.google.com/dly-sync
        </p>

        <!-- RSVP Buttons -->
        <div class="mt-3 pt-2 border-t border-[#e2d5bd]">
          <span class="text-[9px] font-mono font-bold text-stone-500 uppercase block mb-1">LA TUA CONFERMA (RSVP):</span>
          <div class="grid grid-cols-3 gap-1.5">
            <button type="button" data-rsvp="yes" class="rsvp-btn py-1.5 rounded bg-emerald-700 text-white font-mono text-[10px] font-black uppercase shadow-xs cursor-pointer">
              ✓ PARTECIPA
            </button>
            <button type="button" data-rsvp="maybe" class="rsvp-btn py-1.5 rounded bg-stone-200 hover:bg-stone-300 text-stone-800 font-mono text-[10px] font-bold uppercase cursor-pointer">
              ? IN FORSE
            </button>
            <button type="button" data-rsvp="no" class="rsvp-btn py-1.5 rounded bg-stone-200 hover:bg-stone-300 text-stone-800 font-mono text-[10px] font-bold uppercase cursor-pointer">
              ✕ DECLINA
            </button>
          </div>
        </div>
      </div>

      <!-- Promemoria e Notifiche -->
      <div class="flex items-center justify-between pt-2 border-t border-[#d8c8a8]">
        <button id="agenda-remind-btn" type="button" class="text-stone-700 hover:text-stone-900 font-mono text-[10px] font-bold flex items-center gap-1 cursor-pointer">
          <span id="remind-icon">🔔</span>
          <span id="remind-text">Promemoria Attivo (15m prima)</span>
        </button>
        <span class="text-[9px] font-mono text-stone-500">FILOFAX #084</span>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var events = [
    { id: "1", time: "09:30 - 10:00", title: "Daily Standup Design & Dev", location: "📍 Google Meet • meet.google.com/dly-sync", tag: "CONFERMATO", isUrgent: false },
    { id: "2", time: "14:30 - 15:30", title: "Review Design System Sprint", location: "📍 Sala Riunioni 3B • Google Meet", tag: "URGENTE ★", isUrgent: true }
  ];
  var currentId = "1";

  // Elements
  var rings = document.getElementById("binder-rings");
  var ringMechs = document.querySelectorAll(".ring-mech");
  var isOpen = false;

  if (rings) {
    rings.onclick = function() {
      isOpen = !isOpen;
      ringMechs.forEach(function(r) {
        r.style.transform = isOpen ? "translateX(4px) scaleX(0.7)" : "translateX(0) scaleX(1)";
      });
    };
  }

  var toggleAddBtn = document.getElementById("toggle-add-btn");
  var toggleAddIcon = document.getElementById("toggle-add-icon");
  var toggleAddText = document.getElementById("toggle-add-text");
  var addEventForm = document.getElementById("add-event-form");
  var cancelAddBtn = document.getElementById("cancel-add-btn");
  var saveEventBtn = document.getElementById("save-event-btn");
  var newTitle = document.getElementById("new-event-title");
  var newTime = document.getElementById("new-event-time");
  var newLoc = document.getElementById("new-event-location");
  var eventsCountLabel = document.getElementById("events-count-label");
  var timelineEl = document.getElementById("events-timeline");

  var activeTitle = document.getElementById("active-title");
  var activeTime = document.getElementById("active-time");
  var activeLocation = document.getElementById("active-location");
  var activeTag = document.getElementById("active-tag");

  function renderTimeline() {
    timelineEl.innerHTML = "";
    events.forEach(function(ev) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("data-id", ev.id);
      var isSelected = ev.id === currentId;
      btn.className = isSelected
        ? "event-pill px-2.5 py-1.5 rounded-lg bg-[#291f19] text-amber-100 font-mono text-xs font-bold border border-amber-900 shrink-0 cursor-pointer text-left"
        : "event-pill px-2.5 py-1.5 rounded-lg bg-white/70 hover:bg-white text-stone-800 font-mono text-xs border border-[#cfbe9e] shrink-0 cursor-pointer text-left";
      
      btn.innerHTML = '<span class="block text-[9px] ' + (ev.isUrgent ? 'text-red-600 font-bold' : 'text-amber-600') + '">' + ev.time + '</span>' +
                      '<span class="block truncate max-w-[120px]">' + ev.title + '</span>';
      
      btn.onclick = function() {
        currentId = ev.id;
        renderTimeline();
        showActiveEvent();
      };
      timelineEl.appendChild(btn);
    });
    eventsCountLabel.textContent = events.length + " Impegni Programmati";
  }

  function showActiveEvent() {
    var ev = events.find(function(e) { return e.id === currentId; }) || events[0];
    if (!ev) return;
    activeTitle.textContent = ev.title;
    activeTime.textContent = ev.time;
    activeLocation.textContent = ev.location;
    activeTag.textContent = ev.tag;
  }

  if (toggleAddBtn) {
    toggleAddBtn.onclick = function() {
      var isHidden = addEventForm.classList.contains("hidden");
      if (isHidden) {
        addEventForm.classList.remove("hidden");
        toggleAddIcon.textContent = "✕";
        toggleAddText.textContent = "Chiudi";
      } else {
        addEventForm.classList.add("hidden");
        toggleAddIcon.textContent = "+";
        toggleAddText.textContent = "Nuovo";
      }
    };
  }

  if (cancelAddBtn) {
    cancelAddBtn.onclick = function() {
      addEventForm.classList.add("hidden");
      toggleAddIcon.textContent = "+";
      toggleAddText.textContent = "Nuovo";
    };
  }

  if (saveEventBtn) {
    saveEventBtn.onclick = function() {
      var title = newTitle.value.trim();
      if (!title) return;
      var time = newTime.value.trim() || "16:00 - 17:00";
      var loc = newLoc.value.trim() || "Sala Riunioni";
      var newEv = {
        id: String(Date.now()),
        title: title,
        time: time,
        location: "📍 " + loc,
        tag: "NUOVO",
        isUrgent: false
      };
      events.push(newEv);
      currentId = newEv.id;
      newTitle.value = "";
      newTime.value = "";
      newLoc.value = "";
      addEventForm.classList.add("hidden");
      toggleAddIcon.textContent = "+";
      toggleAddText.textContent = "Nuovo";
      renderTimeline();
      showActiveEvent();
    };
  }

  var rsvpButtons = document.querySelectorAll(".rsvp-btn");
  rsvpButtons.forEach(function(btn) {
    btn.onclick = function() {
      rsvpButtons.forEach(function(b) {
        b.className = "rsvp-btn py-1.5 rounded bg-stone-200 hover:bg-stone-300 text-stone-800 font-mono text-[10px] font-bold uppercase cursor-pointer";
      });
      var status = this.getAttribute("data-rsvp");
      if (status === "yes") {
        this.className = "rsvp-btn py-1.5 rounded bg-emerald-700 text-white font-mono text-[10px] font-black uppercase shadow-xs cursor-pointer";
      } else if (status === "maybe") {
        this.className = "rsvp-btn py-1.5 rounded bg-amber-600 text-white font-mono text-[10px] font-black uppercase shadow-xs cursor-pointer";
      } else {
        this.className = "rsvp-btn py-1.5 rounded bg-rose-700 text-white font-mono text-[10px] font-black uppercase shadow-xs cursor-pointer";
      }
    };
  });

  var remindBtn = document.getElementById("agenda-remind-btn");
  var remindText = document.getElementById("remind-text");
  var remindIcon = document.getElementById("remind-icon");
  var isRemind = true;
  if (remindBtn) {
    remindBtn.onclick = function() {
      isRemind = !isRemind;
      remindIcon.textContent = isRemind ? "🔔" : "🔕";
      remindText.textContent = isRemind ? "Promemoria Attivo (15m prima)" : "Promemoria Disattivato";
    };
  }
})();
</script>

</body>
</html>
