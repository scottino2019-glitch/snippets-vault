<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Giradischi Hi-Fi con Vinile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 flex items-center justify-center min-h-screen p-4 font-sans antialiased">

  <div class="w-full max-w-lg mx-auto rounded-3xl bg-gradient-to-b from-indigo-950/90 via-zinc-950 to-zinc-950 border border-indigo-900/40 p-6 sm:p-7 text-white shadow-2xl relative overflow-hidden">
    <!-- Top Header -->
    <div class="flex items-center justify-between pb-4 border-b border-white/10 relative z-10">
      <div class="flex items-center gap-2">
        <svg id="discIcon" class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="text-[11px] font-mono tracking-widest uppercase text-indigo-300">Vinyl Studio Master</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="px-2 py-0.5 rounded-full text-[10px] font-mono bg-indigo-500/20 text-indigo-300 border border-indigo-400/30">24-BIT / 96KHZ</span>
        <button id="favBtn" class="text-zinc-400 hover:text-rose-400">♥</button>
      </div>
    </div>

    <!-- Center Album Sleeve & Sliding Vinyl Record -->
    <div class="my-6 flex items-center justify-center gap-4 relative">
      <div class="relative w-44 h-44 sm:w-52 sm:h-52">
        <!-- Vinyl Record that slides out when playing -->
        <div id="vinylDisc" class="absolute top-2 bottom-2 w-40 h-40 sm:w-48 sm:h-48 rounded-full bg-zinc-950 border-4 border-zinc-800 shadow-2xl flex items-center justify-center transition-all duration-700 ease-out z-0 translate-x-4">
          <div class="w-32 h-32 sm:w-36 sm:h-36 rounded-full border border-zinc-700/60 flex items-center justify-center">
            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full border border-zinc-700/60 flex items-center justify-center">
              <div class="w-14 h-14 rounded-full bg-indigo-600 flex items-center justify-center shadow-inner">
                <div class="w-4 h-4 rounded-full bg-zinc-950"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Album Jacket Cover -->
        <div class="relative z-10 w-full h-full rounded-2xl overflow-hidden shadow-2xl ring-1 ring-white/20">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop" alt="Album Art" class="w-full h-full object-cover" />
        </div>
      </div>
    </div>

    <!-- Track Metadata & Equalizer -->
    <div class="relative z-10">
      <div class="flex items-center justify-between">
        <div>
          <h3 id="trackTitle" class="text-lg sm:text-xl font-bold tracking-tight text-white">Neon Solitude</h3>
          <p id="trackArtist" class="text-xs text-zinc-400 mt-0.5">Kuro Studio • Spatial Reverie</p>
        </div>
        <!-- Equalizer Bars -->
        <div id="eqContainer" class="flex items-end gap-1 h-6 px-2 py-1 bg-black/40 rounded-lg border border-white/10">
          <span class="w-1 bg-indigo-400 rounded-full h-2 transition-all duration-200"></span>
          <span class="w-1 bg-indigo-400 rounded-full h-4 transition-all duration-200"></span>
          <span class="w-1 bg-indigo-400 rounded-full h-6 transition-all duration-200"></span>
          <span class="w-1 bg-indigo-400 rounded-full h-3 transition-all duration-200"></span>
          <span class="w-1 bg-indigo-400 rounded-full h-5 transition-all duration-200"></span>
        </div>
      </div>

      <!-- Scrubber -->
      <div class="mt-5">
        <div id="audioScrubber" class="w-full h-1.5 hover:h-2 bg-zinc-800 rounded-full cursor-pointer relative transition-all">
          <div id="audioFill" class="h-full bg-gradient-to-r from-indigo-500 to-rose-400 rounded-full" style="width: 42%;"></div>
        </div>
        <div class="flex items-center justify-between text-[11px] font-mono text-zinc-400 mt-2">
          <span id="audioCurrent">01:35</span>
          <span>03:48</span>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="mt-4 pt-4 border-t border-white/10 flex items-center justify-between">
        <button id="prevBtn" class="text-zinc-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>

        <button id="playBtn" class="w-14 h-14 rounded-full bg-gradient-to-tr from-indigo-600 to-indigo-500 text-white flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all">
          <svg id="playIcon" class="w-6 h-6 fill-current translate-x-0.5" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>

        <button id="nextBtn" class="text-zinc-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let isPlaying = false;
    let progress = 42;
    const durationSec = 228;

    const vinyl = document.getElementById('vinylDisc');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const discIcon = document.getElementById('discIcon');
    const scrubber = document.getElementById('audioScrubber');
    const fill = document.getElementById('audioFill');
    const currentText = document.getElementById('audioCurrent');
    const eqBars = document.querySelectorAll('#eqContainer span');

    function formatTime(s) {
      const mins = Math.floor(s / 60).toString().padStart(2, '0');
      const secs = (s % 60).toString().padStart(2, '0');
      return mins + ':' + secs;
    }

    let eqInterval = null;

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        vinyl.className = 'absolute top-2 bottom-2 w-40 h-40 sm:w-48 sm:h-48 rounded-full bg-zinc-950 border-4 border-zinc-800 shadow-2xl flex items-center justify-center transition-all duration-700 ease-out z-0 translate-x-16 sm:translate-x-20 rotate-180';
        discIcon.classList.add('animate-spin');
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        eqInterval = setInterval(() => {
          eqBars.forEach(bar => {
            bar.style.height = (Math.floor(Math.random() * 20) + 4) + 'px';
          });
        }, 150);
      } else {
        vinyl.className = 'absolute top-2 bottom-2 w-40 h-40 sm:w-48 sm:h-48 rounded-full bg-zinc-950 border-4 border-zinc-800 shadow-2xl flex items-center justify-center transition-all duration-700 ease-out z-0 translate-x-4 rotate-0';
        discIcon.classList.remove('animate-spin');
        playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        clearInterval(eqInterval);
      }
    }

    playBtn.addEventListener('click', togglePlay);

    scrubber.addEventListener('click', (e) => {
      const rect = scrubber.getBoundingClientRect();
      progress = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      fill.style.width = progress + '%';
      const cur = Math.floor((progress / 100) * durationSec);
      currentText.textContent = formatTime(cur);
    });

    document.getElementById('favBtn').addEventListener('click', function() {
      this.classList.toggle('text-rose-500');
    });
  </script>
</body>
</html>
