<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taccuino Moleskine - Componente Tailwind CSS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-[#faf9f6] text-stone-900 min-h-screen flex items-center justify-center p-6 sm:p-12">

<!-- =========================================================================
     BLOCKNOTE MOLESKINE IN PELLE (HTML + TAILWIND CSS + VANILLA JS)
     Fogli a righe color seppia, riga rossa di margine, spunta impegni,
     aggiunta nuovi appunti/task, barra di progresso e fermaglio elastico
     ========================================================================= -->
<div id="blocknote-card" class="max-w-md w-full select-none flex flex-col items-center justify-center p-2 relative">
  <!-- Nastrino Segnalibro Pendente dal Basso -->
  <div class="absolute -bottom-3 left-12 w-4 h-9 bg-gradient-to-b from-amber-700 to-amber-900 rounded-b shadow-md z-20 pointer-events-none"></div>

  <!-- Copertina in Pelle con Cuciture Perimetrali -->
  <div class="w-full rounded-2xl p-4 shadow-2xl relative border-2 bg-[#352114] border-[#553621] text-stone-100">
    <!-- Cucitura tratteggiata -->
    <div class="absolute inset-1.5 rounded-xl border border-dashed border-[#8c603e]/40 pointer-events-none"></div>

    <!-- Fermaglio in Ottone Superiore -->
    <div class="absolute top-1 left-9 z-25">
      <div class="w-4 h-8 rounded-full border-2 border-amber-300 bg-transparent shadow-md"></div>
    </div>

    <!-- Pagina Avorio a Righe del Taccuino -->
    <div class="rounded-xl p-4 sm:p-5 shadow-lg relative border-2 border-[#d5c3a3] text-stone-900 bg-[#fbf8ee] overflow-hidden">
      <!-- Riga Rossa Verticale di Margine -->
      <div class="absolute top-0 bottom-0 left-8 w-0.5 bg-rose-400/60 pointer-events-none z-10"></div>

      <!-- Testata Taccuino -->
      <div class="flex items-center justify-between pl-6 pb-2 mb-2 border-b border-[#cbb692] relative z-10">
        <div>
          <span class="text-[9px] font-mono font-black uppercase tracking-widest text-amber-900 block">
            MOLESKINE • LISTA ATTIVITÀ
          </span>
          <h3 class="font-serif font-black text-base sm:text-lg text-[#2a1b11] leading-tight mt-0.5">
            Appunti & Priorità Design
          </h3>
        </div>
        <span id="note-count-badge" class="px-2 py-0.5 rounded bg-[#dfceb0] text-[10px] font-mono font-bold text-stone-800 border border-[#bfa984]">
          2/4 Fatti
        </span>
      </div>

      <!-- Barra di Progresso -->
      <div class="pl-6 mb-3 relative z-10">
        <div class="flex justify-between text-[11px] font-mono font-bold text-stone-700 mb-1">
          <span>Avanzamento impegni:</span>
          <span id="progress-text" class="text-amber-900 font-black">50%</span>
        </div>
        <div class="w-full h-2 bg-[#dfceb0] rounded-full overflow-hidden border border-[#bfa984]/50">
          <div id="progress-bar" class="h-full rounded-full bg-gradient-to-r from-amber-700 to-amber-900 transition-all duration-300 w-1/2"></div>
        </div>
      </div>

      <!-- Lista Task con Scroll Non Bloccante -->
      <div id="todo-list-container" class="space-y-2 pl-6 relative z-10 max-h-56 overflow-y-auto pr-1">
        <!-- Elementi inseriti via JS -->
      </div>

      <!-- Modulo per Aggiungere Nuovi Appunti / Impegni -->
      <form id="add-note-form" class="mt-3 pl-6 pt-2.5 border-t border-[#cbb692] flex gap-2 relative z-10">
        <input
          id="new-note-input"
          type="text"
          placeholder="Scrivi a penna un nuovo appunto..."
          class="flex-1 px-3 py-1.5 rounded-lg bg-white border border-[#cbb692] text-xs font-serif placeholder:italic placeholder:text-stone-400 text-stone-900 focus:outline-none focus:ring-1 focus:ring-amber-800 shadow-2xs"
          required
        />
        <button
          type="submit"
          class="px-3 py-1.5 rounded-lg bg-[#3b2517] hover:bg-[#2c1a0e] text-amber-100 font-mono font-bold text-xs flex items-center gap-1 shadow-sm cursor-pointer shrink-0"
        >
          <span>+ Aggiungi</span>
        </button>
      </form>
    </div>

    <!-- Elastico Verticale sul Bordo Esterno Destro (Non intralcia il testo) -->
    <div
      id="notebook-elastic"
      title="Elastico di chiusura Moleskine"
      class="absolute top-0 bottom-0 right-1.5 w-2.5 bg-stone-950 border-x border-stone-800 shadow-md z-30 pointer-events-none flex flex-col justify-around items-center"
      style="background-image: repeating-linear-gradient(45deg, #1c1917, #1c1917 2px, #292524 3px);"
    >
      <div class="w-1 h-4 bg-stone-700/60 rounded-full"></div>
      <div class="w-1 h-4 bg-stone-700/60 rounded-full"></div>
    </div>
  </div>
</div>

<script>
(function() {
  var todos = [
    { id: 1, text: "Definire i design tokens per spaziatura 4px/8px", done: true },
    { id: 2, text: "Esportare icone SVG in formato compatibile", done: true },
    { id: 3, text: "Revisionare palette semantica contrasto WCAG AAA", done: false },
    { id: 4, text: "Testare animazioni con spring motion a 60fps", done: false }
  ];

  var container = document.getElementById("todo-list-container");
  var form = document.getElementById("add-note-form");
  var input = document.getElementById("new-note-input");
  var countBadge = document.getElementById("note-count-badge");
  var progressText = document.getElementById("progress-text");
  var progressBar = document.getElementById("progress-bar");

  function render() {
    container.innerHTML = "";
    var completed = 0;

    todos.forEach(function(todo) {
      if (todo.done) completed++;

      var row = document.createElement("div");
      row.className = "flex items-center justify-between gap-2 p-1 rounded hover:bg-black/5 transition-colors cursor-pointer group";

      var left = document.createElement("div");
      left.className = "flex items-center gap-2.5 min-w-0 flex-1";

      var checkBtn = document.createElement("button");
      checkBtn.type = "button";
      checkBtn.className = "w-4 h-4 rounded-xs border flex items-center justify-center shrink-0 transition-all cursor-pointer " +
        (todo.done ? "bg-amber-900 border-amber-950 text-white" : "border-stone-400 bg-white hover:border-stone-600");
      checkBtn.innerHTML = todo.done ? "✓" : "";

      var span = document.createElement("span");
      span.className = "text-xs font-serif leading-tight break-words " +
        (todo.done ? "line-through text-stone-400 italic" : "text-[#2a1b11] font-semibold hover:text-amber-900");
      span.textContent = todo.text;

      left.appendChild(checkBtn);
      left.appendChild(span);

      left.onclick = function() {
        todo.done = !todo.done;
        render();
      };

      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "text-stone-400 hover:text-rose-700 p-1 text-xs transition-colors cursor-pointer";
      delBtn.innerHTML = "✕";
      delBtn.title = "Elimina";
      delBtn.onclick = function(e) {
        e.stopPropagation();
        todos = todos.filter(function(t) { return t.id !== todo.id; });
        render();
      };

      row.appendChild(left);
      row.appendChild(delBtn);
      container.appendChild(row);
    });

    var pct = todos.length ? Math.round((completed / todos.length) * 100) : 0;
    countBadge.textContent = completed + "/" + todos.length + " Fatti";
    progressText.textContent = pct + "%";
    progressBar.style.width = pct + "%";
  }

  if (form) {
    form.onsubmit = function(e) {
      e.preventDefault();
      var val = input.value.trim();
      if (!val) return;
      todos.push({
        id: Date.now(),
        text: val,
        done: false
      });
      input.value = "";
      render();
    };
  }

  render();
})();
</script>

</body>
</html>
