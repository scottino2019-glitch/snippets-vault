<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto Tailwind CSS</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  
  <style>
    body { background-color: #1f130b; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #board-canvas {
      width: 100%;
      height: 300px;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
  </style>


  <!-- Tailwind CSS Config -->
  <script>
    
window.tailwind = window.tailwind || {};
window.module = window.module || { exports: {} };
window.exports = window.exports || {};
try {
  // Configurazione Tailwind
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: '#0ea5e9',
      }
    }
  }
}
  if (window.module && window.module.exports && Object.keys(window.module.exports).length > 0) {
    window.tailwind.config = window.module.exports;
  }
} catch(e) {
  console.warn('Errore esecuzione tailwind.config:', e.message);
}
    if (window.tailwind && window.tailwind.config && !window.tailwind.config.darkMode) {
      window.tailwind.config.darkMode = 'class';
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>

  <!-- Custom CSS & Tailwind Directives -->
  
</head>
<body class="bg-[#0b0f19] text-[#f1f5f9] min-h-screen bg-[#1f130b] text-neutral-100 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans">


<div class="w-full max-w-xl mx-auto select-none p-2 sm:p-4 font-sans">
  <div class="relative bg-gradient-to-b from-[#6e3713] via-[#854317] to-[#54290d] rounded-3xl p-3 sm:p-5 shadow-2xl border-4 border-[#3e1e0a]">
    
    <!-- Angolari Dorati d'Ottone -->
    <div class="absolute top-1.5 left-1.5 w-6 h-6 border-t-2 border-l-2 border-amber-400 rounded-tl-xl pointer-events-none"></div>
    <div class="absolute top-1.5 right-1.5 w-6 h-6 border-t-2 border-r-2 border-amber-400 rounded-tr-xl pointer-events-none"></div>
    <div class="absolute bottom-1.5 left-1.5 w-6 h-6 border-b-2 border-l-2 border-amber-400 rounded-bl-xl pointer-events-none"></div>
    <div class="absolute bottom-1.5 right-1.5 w-6 h-6 border-b-2 border-r-2 border-amber-400 rounded-br-xl pointer-events-none"></div>

    <!-- Intestazione Cornice -->
    <div class="flex items-center justify-between px-2 pb-2 text-amber-100 text-xs">
      <span id="board-title-label" class="font-serif font-black tracking-wide text-amber-200 text-sm">✦ Ardesia Tradizionale</span>
      <div class="flex items-center gap-1.5">
        <button id="board-type-toggle" type="button" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-950/80 border border-amber-700/60 text-amber-200 hover:bg-amber-900 transition-colors cursor-pointer">
          Passa a Bianca
        </button>
        <button id="board-clear-btn" type="button" class="p-1.5 px-2 rounded-lg bg-amber-950/80 border border-amber-700/60 text-amber-200 hover:text-rose-300 transition-colors cursor-pointer" title="Cancella lavagna">
          🗑 Cancella
        </button>
        <button id="board-download-btn" type="button" class="p-1.5 px-2 rounded-lg bg-amber-950/80 border border-amber-700/60 text-amber-200 hover:text-emerald-300 transition-colors cursor-pointer" title="Scarica disegno PNG">
          💾 Salva PNG
        </button>
      </div>
    </div>

    <!-- Superficie Lavagna Ardesia Canvas -->
    <div class="relative mt-2 rounded-2xl overflow-hidden shadow-inner border-2 border-amber-950/80 bg-[#1b382b]" id="board-container">
      <canvas id="board-canvas" width="600" height="320"></canvas>
    </div>

    <!-- Ripiano Porta Gessetti 3D e Cancellino di Feltro -->
    <div class="mt-3 bg-gradient-to-r from-[#4d250b] via-[#63300f] to-[#4d250b] rounded-xl p-2.5 px-4 border-t-2 border-amber-950/80 shadow-inner flex flex-wrap items-center justify-between gap-3">
      
      <!-- Gessetti Colorati 3D -->
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-bold uppercase tracking-wider text-amber-300 mr-1">Gessetti:</span>
        <button type="button" data-color="#fefce8" class="board-chalk w-5 sm:w-6 h-10 sm:h-12 rounded-t-sm rounded-b-md bg-[#fefce8] -translate-y-2 ring-2 ring-amber-300 shadow-lg cursor-pointer transition-all"></button>
        <button type="button" data-color="#fef08a" class="board-chalk w-5 sm:w-6 h-10 sm:h-12 rounded-t-sm rounded-b-md bg-[#fef08a] shadow cursor-pointer transition-all"></button>
        <button type="button" data-color="#86efac" class="board-chalk w-5 sm:w-6 h-10 sm:h-12 rounded-t-sm rounded-b-md bg-[#86efac] shadow cursor-pointer transition-all"></button>
        <button type="button" data-color="#7dd3fc" class="board-chalk w-5 sm:w-6 h-10 sm:h-12 rounded-t-sm rounded-b-md bg-[#7dd3fc] shadow cursor-pointer transition-all"></button>
        <button type="button" data-color="#f472b6" class="board-chalk w-5 sm:w-6 h-10 sm:h-12 rounded-t-sm rounded-b-md bg-[#f472b6] shadow cursor-pointer transition-all"></button>
      </div>

      <!-- Cancellino Feltro e Spessori -->
      <div class="flex items-center gap-3">
        <button id="board-eraser-btn" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-[#3b1d09] text-amber-200 border border-amber-900 shadow-md cursor-pointer hover:bg-[#4a240c] transition-all">
          <div class="w-5 h-3 rounded-xs bg-neutral-900 border border-neutral-700 flex flex-col justify-between">
            <div class="h-1 bg-amber-700 rounded-t-xs"></div>
          </div>
          <span>Cancellino</span>
        </button>

        <!-- Tratto Spessore -->
        <div class="flex items-center gap-1 bg-amber-950/60 p-1 rounded-lg border border-amber-800/40">
          <button type="button" data-size="2" class="board-size-btn w-6 h-6 rounded flex items-center justify-center text-amber-200 cursor-pointer text-xs">●</button>
          <button type="button" data-size="4" class="board-size-btn w-6 h-6 rounded flex items-center justify-center bg-amber-400 text-amber-950 font-bold cursor-pointer text-sm">●</button>
          <button type="button" data-size="8" class="board-size-btn w-6 h-6 rounded flex items-center justify-center text-amber-200 font-extrabold cursor-pointer text-base">●</button>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById('board-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  var container = document.getElementById('board-container');
  var isDrawing = false;
  var currentColor = '#fefce8';
  var isEraser = false;
  var strokeWidth = 4;
  var isChalkboard = true;
  var lastX = 0;
  var lastY = 0;

  var chalks = document.querySelectorAll('.board-chalk');
  var eraserBtn = document.getElementById('board-eraser-btn');
  var clearBtn = document.getElementById('board-clear-btn');
  var downloadBtn = document.getElementById('board-download-btn');
  var typeToggle = document.getElementById('board-type-toggle');
  var titleLabel = document.getElementById('board-title-label');
  var sizeBtns = document.querySelectorAll('.board-size-btn');

  function initGreeting() {
    ctx.fillStyle = isChalkboard ? '#ffffff' : '#0f172a';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText('✍️ Lavagna a mano libera attiva!', 35, 95);
    ctx.fillStyle = isChalkboard ? '#94a3b8' : '#64748b';
    ctx.font = '12px sans-serif';
    ctx.fillText('Scegli un gessetto sul ripiano e disegna.', 35, 120);
  }
  initGreeting();

  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    var clientX = e.clientX;
    var clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    }
    var scaleX = canvas.width / (rect.width || canvas.width);
    var scaleY = canvas.height / (rect.height || canvas.height);
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function start(e) {
    isDrawing = true;
    var pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;

    // Disegna un punto singolo al tocco
    var brushColor = isEraser ? (isChalkboard ? '#1b382b' : '#f8fafc') : currentColor;
    var radius = (isEraser ? strokeWidth * 4 : strokeWidth) / 2;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = brushColor;
    ctx.fill();
  }

  function move(e) {
    if (!isDrawing) return;
    var pos = getPos(e);
    var brushColor = isEraser ? (isChalkboard ? '#1b382b' : '#f8fafc') : currentColor;
    var currentWidth = isEraser ? strokeWidth * 4 : strokeWidth;

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = brushColor;
    ctx.lineWidth = currentWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    lastX = pos.x;
    lastY = pos.y;
  }

  function end() {
    isDrawing = false;
  }

  canvas.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    start(e);
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    move(e);
  }, { passive: false });

  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    end();
  }, { passive: false });

  chalks.forEach(function(c) {
    c.addEventListener('click', function() {
      currentColor = c.getAttribute('data-color');
      isEraser = false;
      chalks.forEach(function(ch) { ch.classList.remove('-translate-y-2', 'ring-2', 'ring-amber-300'); });
      c.classList.add('-translate-y-2', 'ring-2', 'ring-amber-300');
      if (eraserBtn) {
        eraserBtn.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-100', 'text-amber-950');
      }
    });
  });

  if (eraserBtn) {
    eraserBtn.addEventListener('click', function() {
      isEraser = true;
      chalks.forEach(function(ch) { ch.classList.remove('-translate-y-2', 'ring-2', 'ring-amber-300'); });
      eraserBtn.classList.add('ring-2', 'ring-amber-400', 'bg-amber-100', 'text-amber-950');
    });
  }

  sizeBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      strokeWidth = parseInt(btn.getAttribute('data-size') || '4', 10);
      sizeBtns.forEach(function(b) {
        b.classList.remove('bg-amber-400', 'text-amber-950', 'font-bold');
        b.classList.add('text-amber-200');
      });
      btn.classList.add('bg-amber-400', 'text-amber-950', 'font-bold');
      btn.classList.remove('text-amber-200');
    });
  });

  if (typeToggle) {
    typeToggle.addEventListener('click', function() {
      isChalkboard = !isChalkboard;
      if (isChalkboard) {
        if (container) container.className = 'relative mt-2 rounded-2xl overflow-hidden shadow-inner border-2 border-amber-950/80 bg-[#1b382b]';
        if (titleLabel) titleLabel.textContent = '✦ Ardesia Tradizionale';
        typeToggle.textContent = 'Passa a Bianca';
        if (!isEraser && currentColor === '#0f172a') currentColor = '#fefce8';
      } else {
        if (container) container.className = 'relative mt-2 rounded-2xl overflow-hidden shadow-inner border-2 border-amber-950/80 bg-slate-50';
        if (titleLabel) titleLabel.textContent = '✦ Lavagna Bianca';
        typeToggle.textContent = 'Passa ad Ardesia';
        if (!isEraser && currentColor === '#fefce8') currentColor = '#0f172a';
      }
    });
  }

  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });
  }

  if (downloadBtn) {
    downloadBtn.addEventListener('click', function() {
      try {
        var tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        var tempCtx = tempCanvas.getContext('2d');
        if (tempCtx) {
          tempCtx.fillStyle = isChalkboard ? '#1b382b' : '#f8fafc';
          tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
          tempCtx.drawImage(canvas, 0, 0);
        }
        tempCanvas.toBlob(function(blob) {
          if (!blob) return;
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.download = 'lavagna-' + (isChalkboard ? 'ardesia' : 'bianca') + '-' + Date.now() + '.png';
          link.href = url;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
        }, 'image/png');
      } catch (err) {
        var link = document.createElement('a');
        link.download = 'lavagna-' + Date.now() + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    });
  }
})();
</script>




</body>
</html>
