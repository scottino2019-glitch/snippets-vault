<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e242c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #262e38;
      border: 1px solid #374353;
      padding: 16px 20px;
      border-radius: 12px;
      min-width: 280px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f59e0b;
      color: #1e242c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }
    .info-name {
      margin: 0;
      font-size: 15px;
      color: #e2e8f0;
      font-weight: 600;
    }
    .info-role {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: #94a3b8;
    }
    .badge-status {
      margin-left: auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>
  <div class="user-card">
    <div class="avatar">MR</div>
    <div>
      <h4 class="info-name">Marco Rossi</h4>
      <p class="info-role">Frontend Specialist</p>
    </div>
    <div class="badge-status" title="Attivo"></div>
  </div>
</body>
</html>
