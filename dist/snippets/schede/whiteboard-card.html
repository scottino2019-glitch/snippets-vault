<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Lavagna Creativa Freeform Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 flex items-center justify-center min-h-screen p-4 font-sans antialiased">

  <div id="whiteboardContainer" class="w-full max-w-3xl mx-auto rounded-3xl bg-zinc-950 border border-zinc-800 shadow-2xl overflow-hidden ring-1 ring-white/10 select-none min-h-[540px] flex flex-col justify-between">
    <!-- Top Toolbar -->
    <div class="p-3.5 bg-zinc-900 border-b border-zinc-800 flex flex-wrap items-center justify-between gap-3 text-xs">
      <!-- Drawing Tools -->
      <div class="flex items-center gap-1 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
        <button id="toolPen" class="px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer bg-indigo-600 text-white font-bold shadow-xs" title="Penna Fluida">
          ✏️ <span class="hidden sm:inline">Penna</span>
        </button>

        <button id="toolHighlighter" class="px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer text-zinc-400 hover:text-white" title="Evidenziatore Fluo">
          🖍️ <span class="hidden sm:inline">Fluo</span>
        </button>

        <button id="toolRainbow" class="px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer text-zinc-400 hover:text-white" title="Pennello Magico Arcobaleno">
          🌈 <span class="hidden sm:inline">Arcobaleno</span>
        </button>

        <button id="toolSpray" class="px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer text-zinc-400 hover:text-white" title="Spray Artistico">
          💨 <span class="hidden sm:inline">Spray</span>
        </button>

        <button id="toolEraser" class="px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer text-zinc-400 hover:text-white" title="Gomma">
          🧽 <span class="hidden sm:inline">Gomma</span>
        </button>

        <button id="toolStamp" class="px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer text-zinc-400 hover:text-white" title="Timbri & Adesivi Divertenti">
          ⭐ <span class="hidden sm:inline">Timbri (<span id="activeStampIcon">⭐</span>)</span>
        </button>
      </div>

      <!-- Stroke Width Selector -->
      <div id="strokeRow" class="flex items-center gap-1 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
        <button data-width="3" class="stroke-opt w-6 h-6 rounded-lg flex items-center justify-center text-zinc-500 hover:text-zinc-300 transition-colors" title="Fine (3px)">
          <div class="w-1.5 h-1.5 rounded-full bg-current"></div>
        </button>
        <button data-width="6" class="stroke-opt w-6 h-6 rounded-lg flex items-center justify-center bg-zinc-800 text-white transition-colors" title="Medio (6px)">
          <div class="w-2.5 h-2.5 rounded-full bg-current"></div>
        </button>
        <button data-width="12" class="stroke-opt w-6 h-6 rounded-lg flex items-center justify-center text-zinc-500 hover:text-zinc-300 transition-colors" title="Spesso (12px)">
          <div class="w-3.5 h-3.5 rounded-full bg-current"></div>
        </button>
        <button data-width="24" class="stroke-opt w-6 h-6 rounded-lg flex items-center justify-center text-zinc-500 hover:text-zinc-300 transition-colors" title="Maxi (24px)">
          <div class="w-4.5 h-4.5 rounded-full bg-current"></div>
        </button>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <button id="undoBtn" class="p-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition-colors cursor-pointer" title="Annulla ultimo tratto">
          ↩️
        </button>
        <button id="addNoteBtn" class="px-2.5 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 font-semibold flex items-center gap-1 transition-colors cursor-pointer">
          <span>+ Post-It</span>
        </button>
        <button id="clearBtn" class="p-2 rounded-xl bg-zinc-800 hover:bg-rose-900/50 hover:text-rose-300 text-zinc-400 transition-colors cursor-pointer" title="Pulisci tutto">
          🗑️
        </button>
        <button id="downloadBtn" class="px-3.5 py-1.5 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-bold flex items-center gap-1.5 transition-colors cursor-pointer shadow-sm">
          💾 Salva PNG
        </button>
      </div>
    </div>

    <!-- Sub-bar: Palette + Stamps Selection -->
    <div class="px-4 py-2 bg-zinc-900/80 border-b border-zinc-800 flex flex-wrap items-center justify-between gap-3 text-xs">
      <!-- Colors -->
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-mono text-zinc-500">Colore:</span>
        <div id="paletteRow" class="flex items-center gap-1.5">
          <button class="color-opt w-5 h-5 rounded-full bg-indigo-500 ring-2 ring-white ring-offset-2 ring-offset-zinc-900 scale-110" data-color="#6366f1"></button>
          <button class="color-opt w-5 h-5 rounded-full bg-emerald-500" data-color="#10b981"></button>
          <button class="color-opt w-5 h-5 rounded-full bg-amber-500" data-color="#f59e0b"></button>
          <button class="color-opt w-5 h-5 rounded-full bg-pink-500" data-color="#ec4899"></button>
          <button class="color-opt w-5 h-5 rounded-full bg-cyan-500" data-color="#06b6d4"></button>
          <button class="color-opt w-5 h-5 rounded-full bg-red-500" data-color="#ef4444"></button>
          <button class="color-opt w-5 h-5 rounded-full bg-purple-500" data-color="#8b5cf6"></button>
          <button class="color-opt w-5 h-5 rounded-full bg-zinc-900 border border-zinc-600" data-color="#18181b"></button>
        </div>
      </div>

      <!-- Stamps Selector -->
      <div id="stampsRow" class="flex items-center gap-1.5 bg-zinc-950 px-2 py-1 rounded-xl border border-zinc-800">
        <span class="text-[10px] font-mono text-zinc-400 uppercase tracking-wider mr-1">Timbro:</span>
        <button class="stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center bg-amber-500/20 border border-amber-400" data-stamp="⭐">⭐</button>
        <button class="stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center opacity-80 hover:opacity-100 hover:bg-zinc-800" data-stamp="🚀">🚀</button>
        <button class="stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center opacity-80 hover:opacity-100 hover:bg-zinc-800" data-stamp="🔥">🔥</button>
        <button class="stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center opacity-80 hover:opacity-100 hover:bg-zinc-800" data-stamp="💡">💡</button>
        <button class="stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center opacity-80 hover:opacity-100 hover:bg-zinc-800" data-stamp="❤️">❤️</button>
        <button class="stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center opacity-80 hover:opacity-100 hover:bg-zinc-800" data-stamp="🐱">🐱</button>
        <button class="stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center opacity-80 hover:opacity-100 hover:bg-zinc-800" data-stamp="🌈">🌈</button>
        <button class="stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center opacity-80 hover:opacity-100 hover:bg-zinc-800" data-stamp="⚡">⚡</button>
      </div>
    </div>

    <!-- Canvas Drawing Stage with Interactive Post-Its -->
    <div id="stageArea" class="relative bg-white flex-1 min-h-[380px] cursor-crosshair overflow-hidden">
      <canvas id="whiteboardCanvas" class="w-full h-full block touch-none"></canvas>

      <!-- Initial Sticky Notes -->
      <div id="note1" class="sticky-note absolute top-6 left-6 p-3 rounded-2xl border border-amber-300 bg-amber-100 text-amber-950 shadow-xl max-w-[210px] cursor-move z-20">
        <div class="flex items-center justify-between gap-2 mb-1 pointer-events-none">
          <span class="text-[9px] font-mono uppercase tracking-wider opacity-60 font-bold">Nota Adesiva</span>
          <button class="del-note w-4 h-4 rounded-full flex items-center justify-center opacity-40 hover:opacity-100 pointer-events-auto">✕</button>
        </div>
        <textarea rows="2" class="w-full bg-transparent resize-none focus:outline-none text-xs leading-snug font-sans font-medium">💡 Idea UX: prova il pennello arcobaleno o timbra adesivi!</textarea>
      </div>

      <div id="note2" class="sticky-note absolute top-36 left-72 p-3 rounded-2xl border border-pink-300 bg-pink-100 text-pink-950 shadow-xl max-w-[210px] cursor-move z-20">
        <div class="flex items-center justify-between gap-2 mb-1 pointer-events-none">
          <span class="text-[9px] font-mono uppercase tracking-wider opacity-60 font-bold">Nota Adesiva</span>
          <button class="del-note w-4 h-4 rounded-full flex items-center justify-center opacity-40 hover:opacity-100 pointer-events-auto">✕</button>
        </div>
        <textarea rows="2" class="w-full bg-transparent resize-none focus:outline-none text-xs leading-snug font-sans font-medium">⭐ Sposta e modifica le note con la tastiera!</textarea>
      </div>
    </div>

    <!-- Footer Status -->
    <div class="px-5 py-2.5 bg-zinc-900 border-t border-zinc-800 flex items-center justify-between text-[11px] font-mono text-zinc-400">
      <span>Strumento attivo: <strong id="activeToolLabel" class="text-white uppercase">PENNA</strong></span>
      <span>Disegna, timbra adesivi o trascina le note ovunque</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('whiteboardCanvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stageArea');

    let isDrawing = false;
    let tool = 'pen';
    let currentColor = '#6366f1';
    let currentStroke = 6;
    let currentStamp = '⭐';
    let rainbowHue = 0;
    const historyStack = [];

    function resizeCanvas() {
      const rect = stage.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawGrid(rect.width, rect.height);
      drawInitialArt();
      saveState();
    }

    function drawGrid(w, h) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#e4e4e7';
      for (let x = 15; x < w; x += 24) {
        for (let y = 15; y < h; y += 24) {
          ctx.beginPath();
          ctx.arc(x, y, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawInitialArt() {
      ctx.save();
      ctx.strokeStyle = '#6366f1';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(120, 110, 36, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(160, 110);
      ctx.quadraticCurveTo(190, 85, 220, 110);
      ctx.stroke();

      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(230, 75, 90, 70);
      ctx.restore();
    }

    function saveState() {
      try {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        historyStack.push(data);
        if (historyStack.length > 12) historyStack.shift();
      } catch (e) {}
    }

    function undo() {
      if (historyStack.length <= 1) return;
      historyStack.pop();
      const last = historyStack[historyStack.length - 1];
      if (last) {
        ctx.putImageData(last, 0, 0);
      }
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function placeStamp(x, y) {
      ctx.save();
      ctx.font = '36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(currentStamp, x, y);
      ctx.restore();
      saveState();
    }

    function startDraw(e) {
      const coords = getCoords(e);
      if (tool === 'stamp') {
        placeStamp(coords.x, coords.y);
        return;
      }
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(coords.x, coords.y);
    }

    function draw(e) {
      if (!isDrawing || tool === 'stamp') return;
      const coords = getCoords(e);

      if (tool === 'spray') {
        ctx.fillStyle = currentColor;
        for (let i = 0; i < 18; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = Math.random() * (currentStroke * 3);
          ctx.fillRect(coords.x + Math.cos(a) * r, coords.y + Math.sin(a) * r, 1.5, 1.5);
        }
        return;
      }

      if (tool === 'rainbow') {
        rainbowHue = (rainbowHue + 4) % 360;
        ctx.strokeStyle = 'hsl(' + rainbowHue + ', 95%, 55%)';
        ctx.lineWidth = currentStroke * 1.5;
        ctx.globalAlpha = 1;
      } else if (tool === 'eraser') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = currentStroke * 5;
        ctx.globalAlpha = 1;
      } else if (tool === 'highlighter') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentStroke * 3.5;
        ctx.globalAlpha = 0.35;
      } else {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentStroke;
        ctx.globalAlpha = 1;
      }

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
    }

    function stopDraw() {
      if (!isDrawing) return;
      isDrawing = false;
      ctx.globalAlpha = 1;
      saveState();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
    window.addEventListener('touchend', stopDraw);

    // Tools
    const tools = {
      pen: document.getElementById('toolPen'),
      highlighter: document.getElementById('toolHighlighter'),
      rainbow: document.getElementById('toolRainbow'),
      spray: document.getElementById('toolSpray'),
      eraser: document.getElementById('toolEraser'),
      stamp: document.getElementById('toolStamp')
    };

    function setTool(t) {
      tool = t;
      document.getElementById('activeToolLabel').textContent = t;
      Object.keys(tools).forEach(k => {
        tools[k].className = 'px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer text-zinc-400 hover:text-white';
      });
      if (t === 'rainbow') {
        tools[t].className = 'px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer bg-gradient-to-r from-rose-500 via-amber-500 to-indigo-500 text-white font-bold shadow-xs';
      } else if (t === 'stamp') {
        tools[t].className = 'px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer bg-amber-500 text-zinc-950 font-bold shadow-xs';
      } else {
        tools[t].className = 'px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors cursor-pointer bg-indigo-600 text-white font-bold shadow-xs';
      }
    }

    Object.keys(tools).forEach(k => {
      tools[k].addEventListener('click', () => setTool(k));
    });

    // Stroke width
    document.querySelectorAll('.stroke-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        currentStroke = parseInt(btn.getAttribute('data-width'), 10);
        document.querySelectorAll('.stroke-opt').forEach(b => {
          b.className = 'stroke-opt w-6 h-6 rounded-lg flex items-center justify-center text-zinc-500 hover:text-zinc-300 transition-colors';
        });
        btn.className = 'stroke-opt w-6 h-6 rounded-lg flex items-center justify-center bg-zinc-800 text-white transition-colors';
      });
    });

    // Colors
    document.querySelectorAll('.color-opt').forEach(b => {
      b.addEventListener('click', () => {
        currentColor = b.getAttribute('data-color');
        if (tool === 'eraser') setTool('pen');
        document.querySelectorAll('.color-opt').forEach(opt => {
          opt.classList.remove('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-zinc-900', 'scale-110');
        });
        b.classList.add('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-zinc-900', 'scale-110');
      });
    });

    // Stamps
    document.querySelectorAll('.stamp-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentStamp = btn.getAttribute('data-stamp');
        document.getElementById('activeStampIcon').textContent = currentStamp;
        setTool('stamp');
        document.querySelectorAll('.stamp-btn').forEach(b => {
          b.className = 'stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center opacity-80 hover:opacity-100 hover:bg-zinc-800';
        });
        btn.className = 'stamp-btn w-6 h-6 rounded-lg text-sm flex items-center justify-center bg-amber-500/20 border border-amber-400';
      });
    });

    // Undo, Clear, Save
    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('clearBtn').addEventListener('click', () => {
      const rect = stage.getBoundingClientRect();
      drawGrid(rect.width, rect.height);
      saveState();
    });
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'lavagna_creativa.png';
      a.click();
    });

    // Post-It Drag & Drop Logic
    function bindNote(el) {
      let isDragging = false;
      let offX = 0, offY = 0;

      el.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.classList.contains('del-note')) return;
        isDragging = true;
        offX = e.clientX - el.offsetLeft;
        offY = e.clientY - el.offsetTop;
        el.style.zIndex = 30;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        el.style.left = Math.max(5, Math.min(e.clientX - offX, stage.clientWidth - 200)) + 'px';
        el.style.top = Math.max(5, Math.min(e.clientY - offY, stage.clientHeight - 80)) + 'px';
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          el.style.zIndex = 20;
        }
      });

      const delBtn = el.querySelector('.del-note');
      if (delBtn) {
        delBtn.addEventListener('click', () => el.remove());
      }
    }

    document.querySelectorAll('.sticky-note').forEach(bindNote);

    const noteColors = [
      'border-amber-300 bg-amber-100 text-amber-950',
      'border-emerald-300 bg-emerald-100 text-emerald-950',
      'border-sky-300 bg-sky-100 text-sky-950',
      'border-pink-300 bg-pink-100 text-pink-950'
    ];
    let noteColorIdx = 0;

    document.getElementById('addNoteBtn').addEventListener('click', () => {
      const col = noteColors[noteColorIdx % noteColors.length];
      noteColorIdx++;
      const div = document.createElement('div');
      div.className = 'sticky-note absolute p-3 rounded-2xl border shadow-xl max-w-[210px] cursor-move z-20 ' + col;
      div.style.left = (40 + (noteColorIdx * 25) % 300) + 'px';
      div.style.top = (60 + (noteColorIdx * 30) % 200) + 'px';
      div.innerHTML = `
        <div class="flex items-center justify-between gap-2 mb-1 pointer-events-none">
          <span class="text-[9px] font-mono uppercase tracking-wider opacity-60 font-bold">Nota Adesiva</span>
          <button class="del-note w-4 h-4 rounded-full flex items-center justify-center opacity-40 hover:opacity-100 pointer-events-auto">✕</button>
        </div>
        <textarea rows="2" class="w-full bg-transparent resize-none focus:outline-none text-xs leading-snug font-sans font-medium">✏️ Nuova nota...</textarea>
      `;
      stage.appendChild(div);
      bindNote(div);
    });

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 80);
  </script>
</body>
</html>
