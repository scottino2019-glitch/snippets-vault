<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone padding for maskable -->
  <rect width="512" height="512" rx="128" fill="url(#pwa-grad)"/>
  
  <!-- Central Box & Code Icon -->
  <g transform="translate(106, 106)">
    <!-- Container Card -->
    <rect x="0" y="0" width="300" height="300" rx="48" fill="#ffffff" opacity="0.95"/>
    <rect x="18" y="18" width="264" height="264" rx="36" fill="url(#inner-grad)"/>
    
    <!-- Code Brackets & Slash -->
    <!-- Left Bracket < -->
    <path d="M 105 100 L 45 150 L 105 200" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Bracket > -->
    <path d="M 195 100 L 255 150 L 195 200" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Slash / -->
    <path d="M 165 90 L 135 210" fill="none" stroke="#f0fdfa" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
