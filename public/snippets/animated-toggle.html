<!-- Toggle Switch Animato con Checkbox Tailwind -->
<div class="flex flex-col items-center gap-3 p-5 bg-white dark:bg-slate-800 rounded-2xl shadow-md border border-slate-200 dark:border-slate-700">
  <label class="flex items-center justify-between w-56 cursor-pointer select-none">
    <span class="text-sm font-medium text-slate-700 dark:text-slate-200">
      Notifiche Push
    </span>
    <div class="relative">
      <input 
        type="checkbox" 
        id="toggle-checkbox" 
        class="sr-only peer" 
        checked 
        onchange="document.getElementById('toggle-status').innerText = this.checked ? 'Abilitato' : 'Disabilitato'; document.getElementById('toggle-status').className = this.checked ? 'text-emerald-600 font-bold' : 'text-slate-400 font-bold';"
      />
      <div class="w-12 h-7 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[4px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all dark:border-slate-600 peer-checked:bg-emerald-600"></div>
    </div>
  </label>
  <span class="text-xs text-slate-400">
    Stato: <span id="toggle-status" class="text-emerald-600 font-bold">Abilitato</span>
  </span>
</div>
