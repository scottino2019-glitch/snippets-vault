<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto Tailwind CSS</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  
  <meta charset="UTF-8">
  
  <style>
    body {
      background-color: #3b82f6; /* Sfondo blu per verificare il buco trasparente */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .occhiali {
      display: flex;
      align-items: center;
    }

    /* Solo il bordo nero tondo: NIENTE sfumature, NIENTE ombre */
    .lente {
      width: 80px;
      height: 80px;
      border: 8px solid #000000;
      border-radius: 50%;
      background: none;
      box-shadow: none;
      box-sizing: border-box;
    }

    .ponte {
      width: 20px;
      height: 8px;
      background-color: #000000;
      margin: 0 -1px;
    }
  </style>


  <!-- Tailwind CSS Config -->
  <script>
    
window.tailwind = window.tailwind || {};
window.module = window.module || { exports: {} };
window.exports = window.exports || {};
try {
  // Configurazione Tailwind
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: '#0ea5e9',
      }
    }
  }
}
  if (window.module && window.module.exports && Object.keys(window.module.exports).length > 0) {
    window.tailwind.config = window.module.exports;
  }
} catch(e) {
  console.warn('Errore esecuzione tailwind.config:', e.message);
}
    if (window.tailwind && window.tailwind.config && !window.tailwind.config.darkMode) {
      window.tailwind.config.darkMode = 'class';
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>

  <!-- Custom CSS & Tailwind Directives -->
  
</head>
<body class="bg-[#0b0f19] text-[#f1f5f9] min-h-screen ">


  <div class="occhiali">
    <div class="lente"></div>
    <div class="ponte"></div>
    <div class="lente"></div>
  </div>




</body>
</html>
