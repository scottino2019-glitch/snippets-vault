<!-- Badge Metrica con Trend e Interazione HTML -->
<div class="flex flex-col items-center gap-3 p-5 bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl shadow-sm hover:shadow-md transition-all w-72">
  <div class="flex items-center justify-between w-full">
    <span class="inline-flex items-center gap-1.5 text-xs font-semibold text-stone-600 dark:text-stone-300">
      <span class="text-rose-500 font-bold">●</span>
      Efficienza Snippet
    </span>
    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300">
      ▲ +3.4%
    </span>
  </div>

  <div class="flex items-baseline gap-1 my-1">
    <span id="metric-val" class="text-3xl font-extrabold tracking-tight text-stone-900 dark:text-stone-100">
      98.4
    </span>
    <span class="text-sm font-semibold text-stone-500 dark:text-stone-400">
      %
    </span>
  </div>

  <div class="flex items-center gap-2 w-full pt-2 border-t border-stone-100 dark:border-stone-800/60">
    <button
      type="button"
      onclick="toggleBoost()"
      id="boost-btn"
      class="flex-1 px-3 py-1.5 text-xs font-semibold rounded-xl bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-800 dark:text-stone-200 transition active:scale-95 cursor-pointer"
    >
      Simula Boost
    </button>

    <button
      type="button"
      onclick="copyMetric()"
      id="share-btn"
      class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-stone-900 hover:bg-stone-800 dark:bg-stone-100 dark:hover:bg-white text-white dark:text-stone-900 transition active:scale-95 cursor-pointer"
    >
      Copia
    </button>
  </div>

  <script>
    let isBoosted = false;
    function toggleBoost() {
      isBoosted = !isBoosted;
      document.getElementById('metric-val').innerText = isBoosted ? '99.6' : '98.4';
      document.getElementById('boost-btn').innerText = isBoosted ? 'Ripristina' : 'Simula Boost';
    }
    function copyMetric() {
      const val = document.getElementById('metric-val').innerText + '%';
      navigator.clipboard.writeText(val);
      const btn = document.getElementById('share-btn');
      btn.innerText = 'Copiato!';
      setTimeout(() => { btn.innerText = 'Copia'; }, 1500);
    }
  </script>
</div>
