<!-- Contatore Interattivo HTML + Vanilla JS -->
<div class="flex flex-col items-center justify-center p-6 bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700 w-72">
  <span class="text-xs uppercase tracking-wider font-semibold text-cyan-600 dark:text-cyan-400 mb-2">
    Contatore Interattivo
  </span>
  <div id="counter-val" class="text-4xl font-extrabold text-slate-900 dark:text-white mb-6">
    0
  </div>
  <div class="flex items-center gap-3 w-full justify-center">
    <button
      type="button"
      onclick="updateCounter(-1)"
      class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 font-bold flex items-center justify-center transition active:scale-95 cursor-pointer text-lg"
    >
      -
    </button>
    <button
      type="button"
      onclick="resetCounter()"
      class="px-3.5 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-xs font-semibold text-slate-600 dark:text-slate-300 transition active:scale-95 cursor-pointer"
    >
      Reset
    </button>
    <button
      type="button"
      onclick="updateCounter(1)"
      class="w-10 h-10 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold flex items-center justify-center transition shadow-md shadow-cyan-600/20 active:scale-95 cursor-pointer text-lg"
    >
      +
    </button>
  </div>

  <script>
    let currentCount = 0;
    function updateCounter(diff) {
      currentCount += diff;
      document.getElementById('counter-val').innerText = currentCount;
    }
    function resetCounter() {
      currentCount = 0;
      document.getElementById('counter-val').innerText = currentCount;
    }
  </script>
</div>
