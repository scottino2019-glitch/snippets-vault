<!-- Tag Manager HTML + Vanilla JS -->
<div class="flex flex-col gap-3 p-5 bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl shadow-sm w-80">
  <div class="flex items-center gap-1.5 text-xs font-bold text-stone-700 dark:text-stone-300">
    <span class="text-emerald-500 font-bold">#</span>
    Gestione Tag Dinamica (HTML)
  </div>

  <div id="tags-container" class="flex flex-wrap gap-1.5 min-h-[32px]">
    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-semibold border bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800">
      TailwindCSS
      <button type="button" onclick="this.parentElement.remove()" class="hover:opacity-75 focus:outline-none cursor-pointer">×</button>
    </span>
    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-semibold border bg-amber-100 text-amber-800 border-amber-300 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800">
      HTML5
      <button type="button" onclick="this.parentElement.remove()" class="hover:opacity-75 focus:outline-none cursor-pointer">×</button>
    </span>
    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-semibold border bg-blue-100 text-blue-800 border-blue-300 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-800">
      CSS Utility
      <button type="button" onclick="this.parentElement.remove()" class="hover:opacity-75 focus:outline-none cursor-pointer">×</button>
    </span>
  </div>

  <div class="flex gap-2">
    <input
      type="text"
      id="new-tag-input"
      placeholder="Nuovo tag..."
      onkeydown="if(event.key==='Enter') addTagFromInput()"
      class="flex-1 px-3 py-1.5 text-xs bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl focus:outline-none focus:ring-1 focus:ring-emerald-500 text-stone-900 dark:text-stone-100"
    />
    <button
      type="button"
      onclick="addTagFromInput()"
      class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl transition active:scale-95 cursor-pointer"
    >
      + Aggiungi
    </button>
  </div>

  <script>
    function addTagFromInput() {
      const input = document.getElementById('new-tag-input');
      const val = input.value.trim();
      if (!val) return;
      const tagSpan = document.createElement('span');
      tagSpan.className = 'inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-semibold border bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800';
      tagSpan.innerHTML = val + ' <button type="button" onclick="this.parentElement.remove()" class="hover:opacity-75 focus:outline-none cursor-pointer">×</button>';
      document.getElementById('tags-container').appendChild(tagSpan);
      input.value = '';
    }
  </script>
</div>
