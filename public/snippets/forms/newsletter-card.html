<div class="w-full max-w-md p-6 bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl text-white shadow-xl border border-slate-700">
  <h3 class="text-lg font-semibold mb-1">Rimani Aggiornato</h3>
  <p class="text-sm text-slate-300 mb-4">Ricevi i migliori snippet frontend direttamente ogni settimana.</p>
  <form class="flex gap-2" onsubmit="event.preventDefault()">
    <input 
      type="email" 
      placeholder="nome@azienda.it" 
      class="flex-1 px-4 py-2 bg-slate-950/60 border border-slate-700 rounded-xl text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white"
    />
    <button 
      type="submit" 
      class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-xl transition duration-150 shadow-md shrink-0"
    >
      Iscriviti
    </button>
  </form>
</div>
