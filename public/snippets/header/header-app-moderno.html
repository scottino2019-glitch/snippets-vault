<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .app-header {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #fff1f2;
      border: 1px solid #ffe4e6;
      color: #be123c;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
    }
    .breadcrumb {
      font-size: 13px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .breadcrumb b {
      color: #0f172a;
    }
    .header-search {
      flex: 1;
      max-width: 360px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 36px 8px 34px;
      font-size: 13px;
      color: #1e293b;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      background: #ffffff;
      border-color: #e11d48;
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.12);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
    }
    .kbd-shortcut {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      font-family: monospace;
      background: #e2e8f0;
      color: #475569;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      background: #f8fafc;
      color: #0f172a;
      border-color: #cbd5e1;
    }
    .badge-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      background: #e11d48;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .user-pill:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e11d48;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }
    .user-info {
      text-align: left;
    }
    .user-name {
      font-size: 12px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.2;
    }
    .user-role {
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <div class="app-badge">
        <span>⚡</span>
        <span>Dashboard</span>
      </div>
      <div class="breadcrumb">
        <span>Workspace</span>
        <span>/</span>
        <b>Panoramica</b>
      </div>
    </div>
    <div class="header-search">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" placeholder="Cerca risorse o comandi..." />
      <span class="kbd-shortcut">⌘K</span>
    </div>
    <div class="header-right">
      <button class="icon-btn" title="Notifiche" onclick="alert('Hai 3 notifiche da leggere')">
        <span>🔔</span>
        <span class="badge-dot"></span>
      </button>
      <div class="user-pill" onclick="alert('Profilo Utente: Marco Rossi')">
        <div class="avatar">MR</div>
        <div class="user-info">
          <div class="user-name">Marco Rossi</div>
          <div class="user-role">Team Lead</div>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
