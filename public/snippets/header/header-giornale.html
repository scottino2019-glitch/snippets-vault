<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina Bento Personalizzata</title>
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    /* Reset base */
    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
    }
    /* Stili CSS Personalizzati */
    
  </style>
</head>
<body class="antialiased min-h-screen bg-[#11111b] text-[#cdd6f4]">
<!-- Header Testata Giornale Quotidiano -->
<header class="w-full bg-[#fefce8] text-slate-900 border-2 border-slate-900 rounded-3xl p-6 shadow-[5px_5px_0px_0px_rgba(15,23,42,1)] font-serif space-y-3">
  <div class="flex flex-wrap items-center justify-between border-b border-slate-900 pb-2 text-[10px] font-mono font-bold tracking-wider text-slate-700 uppercase">
    <span>EDIZIONE SPECIALE • VOL. XCVI</span>
    <span>LUNEDÌ, 21 SETTEMBRE 2026</span>
    <span>METEO: SERENO 24°C • € 1,50</span>
  </div>

  <div class="text-center py-2 border-y-2 border-slate-900">
    <h1 class="text-3xl sm:text-5xl font-black tracking-wider uppercase font-serif">
      The Bento Chronicle
    </h1>
    <p class="text-[10px] sm:text-xs font-mono text-slate-600 tracking-[0.3em] uppercase mt-1">
      IL QUOTIDIANO MODULARE DEI COMPONENTI TATTILI
    </p>
  </div>

  <div class="flex items-center justify-between text-xs font-mono pt-1 text-slate-800">
    <span class="font-bold">★ PRIMA PAGINA</span>
    <span class="text-amber-800 font-bold hover:underline cursor-pointer">Sfoglia Indice ➔</span>
  </div>
</header>
</body>
</html>
