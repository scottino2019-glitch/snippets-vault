<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina Bento Personalizzata</title>
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    /* Reset base */
    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
    }
    /* Stili CSS Personalizzati */
    
  </style>
</head>
<body class="antialiased min-h-screen bg-[#11111b] text-[#cdd6f4]">
<!-- Footer Cartolina Postale Retrò -->
<footer class="w-full bg-[#fefce8] text-slate-900 border-2 border-slate-900 rounded-3xl p-6 sm:p-8 shadow-[5px_5px_0px_0px_rgba(15,23,42,1)] font-serif grid grid-cols-1 md:grid-cols-2 gap-8 relative mt-6">
  <div class="space-y-3 md:pr-6">
    <div class="text-xs font-mono font-bold text-amber-900 uppercase tracking-widest border-b border-amber-300 pb-1">
      CARTOLINA D'AUTORE • ED. 2026
    </div>
    <h3 class="text-xl font-bold text-slate-900">Saluti da Bento Studio</h3>
    <p class="text-xs text-slate-700 leading-relaxed font-sans">
      Ogni blocco è forgiato con cura artigianale, proporzioni matematiche e consistenza tattile.
    </p>
    <div class="text-xs font-mono text-slate-500 pt-2">© 2026 Bento Studio • Creato per il web aperto</div>
  </div>

  <div class="md:border-l-2 md:border-dashed md:border-slate-400 md:pl-8 flex flex-col justify-between">
    <div class="flex justify-end mb-3">
      <div class="relative w-16 h-20 bg-amber-100 border-2 border-dashed border-amber-900 p-1 flex flex-col justify-between items-center text-center shadow-xs">
        <span class="text-[7px] font-mono font-bold text-amber-900">POSTE IT</span>
        <span class="text-lg">🏛</span>
        <span class="text-[8px] font-mono font-black text-rose-700">€ 1,20</span>
        <div class="absolute -bottom-2 -left-3 w-10 h-10 rounded-full border border-slate-700 text-[6px] font-mono text-slate-600 flex items-center justify-center rotate-[-15deg] pointer-events-none">
          MILANO
        </div>
      </div>
    </div>

    <div class="space-y-2 text-xs font-mono text-slate-700">
      <div class="border-b border-slate-400 pb-0.5">Destinatario: Designer & Sviluppatore</div>
      <div class="border-b border-slate-400 pb-0.5">Indirizzo: Canvas Web Responsivo</div>
    </div>
  </div>
</footer>
</body>
</html>
