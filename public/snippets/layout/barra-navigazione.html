<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #1e242c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #272f3a;
      border: 1px solid #374353;
      padding: 12px 20px;
      border-radius: 10px;
      max-width: 700px;
      margin: 0 auto;
    }
    .brand {
      font-weight: 700;
      color: #6366f1;
      font-size: 16px;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex;
      gap: 18px;
    }
    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s ease;
    }
    .nav-links a:hover, .nav-links a.active {
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand">✦ PROGETTO</div>
    <div class="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#">Archivio</a>
      <a href="#">Snippet</a>
      <a href="#">Documenti</a>
    </div>
  </nav>
</body>
</html>
