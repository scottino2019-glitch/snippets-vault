<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Raccolta Fumetti</title>
  <style>

.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.comic {
  width: 300px;
  margin: 20px;
  padding: 20px;
  text-align: center;
  background-color: #F1F1F1;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.comic img {
  width: 200px;
  height: 300px;
  object-fit: cover;
  margin-bottom: 10px;
}

header, footer {
  background-color: #2C3E50;
  color: white;
  padding: 10px;
  text-align: center;
}

header h1, footer p {
  margin: 0;
}
</style>
</head>
<body>
  
  <header>
    <h1>Raccolta Fumetti</h1>
  </header>

  <div class="container">
    <div class="comic">
      <img src="comic1.jpg" alt="Comic 1">
      <h2>Titolo del Fumetto 1</h2>
      <p>Descrizione del Fumetto 1</p>
    </div>
    <div class="comic">
      <img src="comic2.jpg" alt="Comic 2">
      <h2>Titolo del Fumetto 2</h2>
      <p>Descrizione del Fumetto 2</p>
    </div>
    <div class="comic">
      <img src="comic3.jpg" alt="Comic 3">
      <h2>Titolo del Fumetto 3</h2>
      <p>Descrizione del Fumetto 3</p>
    </div>
  </div>

  <footer>
    <p>© Anno - Raccolta Fumetti</p>
  </footer>

</body>
</html>
