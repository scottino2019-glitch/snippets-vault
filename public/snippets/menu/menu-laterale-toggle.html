<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto Tailwind CSS</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  

  <!-- Tailwind CSS Config -->
  <script>
    
window.tailwind = window.tailwind || {};
window.module = window.module || { exports: {} };
window.exports = window.exports || {};
try {
  window.tailwind = window.tailwind || {};
window.tailwind.config = {
  darkMode: "class",
  theme: { extend: {} }
};
  if (window.module && window.module.exports && Object.keys(window.module.exports).length > 0) {
    window.tailwind.config = window.module.exports;
  }
} catch(e) {
  console.warn('Errore esecuzione tailwind.config:', e.message);
}
    if (window.tailwind && window.tailwind.config && !window.tailwind.config.darkMode) {
      window.tailwind.config.darkMode = 'class';
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>

  <!-- Custom CSS & Tailwind Directives -->
  <style type="text/tailwindcss">


@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');


html, body {
    margin: 0;
    padding: 0;
}

body {
    background-color: #f1f4f7;
    color: #3b495e;
    font-family: Inter;
    font-size: 1.2rem;
    line-height: 1.5;
}

/* Sliding bar */
.sf-sliding-bar { 
    display: flex; 
    flex-direction: column; 
    gap: 5px; 
    position: fixed; 
    right: 0; 
    top: 50%; 
    transform: translateY(-50%); 
    z-index: 9999; 
}
.sf-sliding-bar a.bar-item { 
    display: flex; 
    justify-content: center; 
    align-items: center;
    position:relative;
    width: 50px; 
    height: 50px; 
    font-size: 16px;
    line-height: 1;
    text-decoration: none;
    color: #3d4c6f;
    background-color: #fff; 
    box-shadow: 0px 0px 8px 0px rgba(0,0,0,.06);
    border-radius: 4px 0 0 4px;
    transition: all 0.2s ease-out;
}
.sf-sliding-bar a:hover.bar-item {
    color: #11151d;
}

.sf-sliding-bar a.bar-item::before,
.sf-sliding-bar a.bar-item::after {
    display: block;
    position: absolute;
    right: 100%;
    top: 50%;
    z-index: 1;
    opacity: 0;
    background: #11151d;
    pointer-events: none; 
    transition: transform 0.2s ease-out;
}
.sf-sliding-bar a.bar-item::before {
    content: attr(data-tooltip);
    max-width: 250px;
    width: 100%;
    width: max-content;
    text-align: center;
    transform: translate(0, -50%);
    padding: 6px 12px;
    font-size: 14px;
    line-height: 1.5;
    border-radius: 3px;
    box-shadow: 0 0 15px rgba(0,0,0,.15);
    color: #fff;
}
.sf-sliding-bar a.bar-item::after {
    content: "";
    transform: translate(5px, -5px) rotate(45deg);
    width: 10px;
    height: 10px;
    border-radius: 2px; 
}

.sf-sliding-bar a.bar-item:hover::before {
    transform: translate(-10px, -50%);
}
.sf-sliding-bar a.bar-item:hover::after {
    transform: translate(-60%, -5px) rotate(45deg);
}
.sf-sliding-bar a.bar-item:hover::before, 
.sf-sliding-bar a.bar-item:hover::after {
    opacity: 1;
}
</style>
</head>
<body class="bg-[#0b0f19] text-[#f1f5f9] min-h-screen ">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<div class="sf-sliding-bar">
    <a class="bar-item item-has-tooltip" data-tooltip="Visit our Facebook" target="_blank" href="#"><i class="fa-brands fa-facebook-f"></i></a>
    <a class="bar-item item-has-tooltip" data-tooltip="Follow us on X" target="_blank" href="#"><i class="fa-brands fa-x-twitter"></i></a>
    <a class="bar-item item-has-tooltip" data-tooltip="Order Samples" href="#"><i class="fa-solid fa-dolly"></i></a>
</div>


</body>
</html>
