<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e242c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .modal-box {
      background: #262e38;
      border: 1px solid #374353;
      border-radius: 12px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .modal-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 20px;
    }
    .modal-title {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #e2e8f0;
      font-weight: 600;
    }
    .modal-text {
      margin: 0 0 20px 0;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-confirm {
      background: #10b981;
      border: none;
      color: #0f172a;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="modal-box">
    <div class="modal-icon">✓</div>
    <h3 class="modal-title">Operazione Riuscita</h3>
    <p class="modal-text">Il frammento di codice HTML è stato salvato e sincronizzato correttamente.</p>
    <div class="modal-actions">
      <button class="btn-secondary">Chiudi</button>
      <button class="btn-confirm">Continua</button>
    </div>
  </div>
</body>
</html>
