<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cassetta a Nastro Retrò - Componente Tailwind CSS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-[#faf9f6] text-stone-900 min-h-screen flex items-center justify-center p-6 sm:p-12">

<!-- =========================================================================
     CASSETTA A NASTRO RETRÒ WALKMAN (HTML + TAILWIND CSS + VANILLA JS)
     Bobine rotanti animate, pulsanti deck Walkman grandi e tattili, display
     tempo digitale e vano audiocassetta vintage
     ========================================================================= -->
<div id="audio-cassette-card" class="max-w-md w-full transition-all duration-300 rounded-2xl p-5 shadow-2xl relative select-none border-2 bg-[#251d18] border-[#4f3a2c] text-stone-100">
  <!-- Alloggiamento Plastico della Cassetta con 4 Viti -->
  <div class="relative w-full rounded-2xl bg-gradient-to-b from-[#1a1715] to-[#0d0b0a] border-2 border-[#524438] p-4 shadow-2xl overflow-hidden mb-4">
    <!-- 4 Viti Angolari -->
    <div class="absolute top-2 left-2 w-3 h-3 rounded-full bg-stone-400 border border-stone-600 flex items-center justify-center">
      <div class="w-1.5 h-0.5 bg-stone-800 rotate-45"></div>
    </div>
    <div class="absolute top-2 right-2 w-3 h-3 rounded-full bg-stone-400 border border-stone-600 flex items-center justify-center">
      <div class="w-1.5 h-0.5 bg-stone-800 -rotate-12"></div>
    </div>
    <div class="absolute bottom-2 left-2 w-3 h-3 rounded-full bg-stone-400 border border-stone-600 flex items-center justify-center">
      <div class="w-1.5 h-0.5 bg-stone-800 -rotate-45"></div>
    </div>
    <div class="absolute bottom-2 right-2 w-3 h-3 rounded-full bg-stone-400 border border-stone-600 flex items-center justify-center">
      <div class="w-1.5 h-0.5 bg-stone-800 rotate-60"></div>
    </div>

    <!-- Etichetta Adesiva Vintage Invecchiata -->
    <div class="rounded-xl bg-gradient-to-b from-[#faf6ec] via-[#f4ebd6] to-[#e8dcbf] border border-[#d6c7a7] p-3 text-stone-900 shadow-md relative overflow-hidden">
      <div class="flex items-center justify-between border-b border-[#c8b793] pb-1 mb-2">
        <div class="flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-xs bg-red-700 text-white font-black text-[9px] flex items-center justify-center">A</span>
          <span class="text-[10px] font-black tracking-widest text-stone-800 uppercase font-mono">HIGH BIAS • TYPE II</span>
        </div>
        <div class="flex items-center gap-2 text-[9px] font-mono font-bold text-stone-600">
          <span>DOLBY B-C NR</span>
          <span class="bg-stone-800 text-amber-300 px-1 py-0.2 rounded text-[8px]">60 MIN</span>
        </div>
      </div>

      <div class="px-1">
        <h4 class="font-serif font-black text-sm tracking-tight text-[#2b1e16] leading-tight italic">
          "Design Soundtrack '94 // Ep. 42: Interfacce Senza Tempo"
        </h4>
        <p class="text-[10px] font-mono text-stone-600 font-semibold mt-0.5">LATO A • STEREO CASSETTE RECORDER</p>
      </div>

      <!-- Finestrella Trasparente con Nastro Magnetico e Bobine Dentate -->
      <div class="relative w-full h-18 bg-[#110e0c] rounded-lg border-2 border-stone-700 mt-3 flex items-center justify-around px-6 overflow-hidden shadow-inner">
        <!-- Bobina Sinistra Dentata -->
        <div id="spool-left" class="w-12 h-12 rounded-full border-2 border-stone-500 bg-[#2b241e] flex items-center justify-center relative shadow-md">
          <div class="w-4 h-4 rounded-full bg-stone-900 border border-stone-600 flex items-center justify-center">
            <div class="w-1.5 h-1.5 bg-amber-400 rounded-full"></div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center"><div class="w-10 h-1 bg-stone-500/60 rounded-full"></div></div>
          <div class="absolute inset-0 flex items-center justify-center"><div class="w-1 h-10 bg-stone-500/60 rounded-full"></div></div>
        </div>

        <!-- Nastro Magnetico Teso al Centro con Scala Graduata -->
        <div class="flex flex-col items-center mx-2">
          <div class="w-14 h-3 bg-stone-800 rounded-t border-t border-x border-stone-600 flex items-center justify-center">
            <div class="w-5 h-1 bg-amber-400/80 rounded-full"></div>
          </div>
          <div class="w-16 h-3 bg-gradient-to-r from-[#29170e] via-[#4d2c1c] to-[#29170e] rounded-xs border-y border-[#6e3e26]"></div>
          <div class="text-[7px] font-mono text-stone-400 mt-0.5 tracking-wider">100 • 50 • 0</div>
        </div>

        <!-- Bobina Destra Dentata -->
        <div id="spool-right" class="w-12 h-12 rounded-full border-2 border-stone-500 bg-[#2b241e] flex items-center justify-center relative shadow-md">
          <div class="w-4 h-4 rounded-full bg-stone-900 border border-stone-600 flex items-center justify-center">
            <div class="w-1.5 h-1.5 bg-amber-400 rounded-full"></div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center"><div class="w-10 h-1 bg-stone-500/60 rounded-full"></div></div>
          <div class="absolute inset-0 flex items-center justify-center"><div class="w-1 h-10 bg-stone-500/60 rounded-full"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- DECK CONTROLLI WALKMAN ANNI '80 CON TASTI TATTILI GRANDI -->
  <div class="rounded-xl bg-[#1c1815] border border-stone-700/80 p-3.5 shadow-inner">
    <!-- Rolling Mechanical Tape Counter -->
    <div class="flex items-center justify-between text-xs font-mono text-stone-300 mb-3 px-1">
      <div class="flex items-center gap-2">
        <span class="text-[10px] font-mono font-bold text-amber-500 uppercase tracking-wider">STATUS:</span>
        <span id="cassette-status" class="px-2 py-0.5 rounded bg-amber-950/60 border border-amber-800/80 text-amber-400 font-bold uppercase tracking-wider text-[10px]">
          IN PAUSA
        </span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] text-stone-400">TEMPO:</span>
        <span id="cassette-timer" class="px-2 py-0.5 bg-black rounded border border-stone-700 font-mono text-xs font-black text-amber-400 shadow-inner">
          12:45 / 34:00
        </span>
      </div>
    </div>

    <!-- Tasti Meccanici Deck Grandi (5 Pulsanti Fisiologici da Walkman) -->
    <div class="grid grid-cols-5 gap-1.5 sm:gap-2 pt-2 border-t border-stone-700">
      <!-- 1. REWIND -->
      <button id="btn-rewind" type="button" class="py-3 px-1 rounded-xl bg-gradient-to-b from-stone-700 to-stone-900 hover:from-stone-600 hover:to-stone-800 active:from-stone-950 active:to-stone-800 border-t border-stone-500 border-b-2 border-b-stone-950 text-stone-200 flex flex-col items-center justify-center gap-1 shadow-md cursor-pointer transition-all active:translate-y-1">
        <span class="text-sm text-amber-400 font-black leading-none">◄◄</span>
        <span class="text-[10px] font-mono font-black uppercase">REW</span>
        <span class="text-[8px] font-mono text-stone-400 leading-none">-15s</span>
      </button>

      <!-- 2. PLAY -->
      <button id="btn-play" type="button" class="py-3 px-1 rounded-xl bg-gradient-to-b from-emerald-700 to-emerald-900 hover:from-emerald-600 hover:to-emerald-800 active:from-emerald-950 active:to-emerald-850 border-t border-emerald-400 border-b-2 border-b-emerald-950 text-white flex flex-col items-center justify-center gap-1 shadow-md cursor-pointer transition-all active:translate-y-1 ring-1 ring-emerald-500/50">
        <span class="text-sm font-black leading-none">▶</span>
        <span class="text-[10px] font-mono font-black uppercase">PLAY</span>
        <span id="play-led" class="w-1.5 h-1.5 rounded-full bg-emerald-400/50"></span>
      </button>

      <!-- 3. PAUSE -->
      <button id="btn-pause" type="button" class="py-3 px-1 rounded-xl bg-gradient-to-b from-amber-700 to-amber-900 hover:from-amber-600 hover:to-amber-800 active:from-amber-950 active:to-amber-850 border-t border-amber-400 border-b-2 border-b-amber-950 text-amber-100 flex flex-col items-center justify-center gap-1 shadow-md cursor-pointer transition-all active:translate-y-1">
        <span class="text-sm font-black leading-none">❚❚</span>
        <span class="text-[10px] font-mono font-black uppercase">PAUSA</span>
        <span class="text-[8px] font-mono text-stone-300 leading-none">HOLD</span>
      </button>

      <!-- 4. FAST FORWARD -->
      <button id="btn-ff" type="button" class="py-3 px-1 rounded-xl bg-gradient-to-b from-stone-700 to-stone-900 hover:from-stone-600 hover:to-stone-800 active:from-stone-950 active:to-stone-800 border-t border-stone-500 border-b-2 border-b-stone-950 text-stone-200 flex flex-col items-center justify-center gap-1 shadow-md cursor-pointer transition-all active:translate-y-1">
        <span class="text-sm text-amber-400 font-black leading-none">►►</span>
        <span class="text-[10px] font-mono font-black uppercase">FF</span>
        <span class="text-[8px] font-mono text-stone-400 leading-none">+30s</span>
      </button>

      <!-- 5. STOP / EJECT -->
      <button id="btn-stop" type="button" class="py-3 px-1 rounded-xl bg-gradient-to-b from-stone-800 to-stone-950 hover:from-stone-700 hover:to-stone-900 active:from-black active:to-stone-950 border-t border-stone-600 border-b-2 border-b-stone-950 text-stone-300 flex flex-col items-center justify-center gap-1 shadow-md cursor-pointer transition-all active:translate-y-1">
        <div class="w-3.5 h-3.5 bg-stone-300 rounded-xs"></div>
        <span class="text-[10px] font-mono font-black uppercase">STOP</span>
        <span class="text-[8px] font-mono text-stone-400 leading-none">RESET</span>
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  var isPlaying = false;
  var sec = 765;
  var totalSec = 2040;
  var timer = null;

  var spoolL = document.getElementById("spool-left");
  var spoolR = document.getElementById("spool-right");
  var playBtn = document.getElementById("btn-play");
  var pauseBtn = document.getElementById("btn-pause");
  var rewBtn = document.getElementById("btn-rewind");
  var ffBtn = document.getElementById("btn-ff");
  var stopBtn = document.getElementById("btn-stop");
  var playLed = document.getElementById("play-led");

  var statusEl = document.getElementById("cassette-status");
  var timerEl = document.getElementById("cassette-timer");

  function formatTime(s) {
    var m = Math.floor(s / 60);
    var remainder = s % 60;
    return (m < 10 ? "0" + m : m) + ":" + (remainder < 10 ? "0" + remainder : remainder);
  }

  function updateTimerText() {
    timerEl.textContent = formatTime(sec) + " / " + formatTime(totalSec);
  }

  function start() {
    if (isPlaying) return;
    isPlaying = true;
    statusEl.textContent = "IN RIPRODUZIONE ●";
    statusEl.className = "px-2 py-0.5 rounded bg-emerald-950/80 border border-emerald-700 text-emerald-400 font-bold uppercase tracking-wider text-[10px]";
    if (playLed) playLed.className = "w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse";

    spoolL.style.animation = "spin 2.5s linear infinite";
    spoolR.style.animation = "spin 2.5s linear infinite";

    timer = setInterval(function() {
      sec = sec + 1;
      if (sec >= totalSec) {
        pause();
        sec = 0;
      }
      updateTimerText();
    }, 1000);
  }

  function pause() {
    isPlaying = false;
    statusEl.textContent = "IN PAUSA";
    statusEl.className = "px-2 py-0.5 rounded bg-amber-950/60 border border-amber-800/80 text-amber-400 font-bold uppercase tracking-wider text-[10px]";
    if (playLed) playLed.className = "w-1.5 h-1.5 rounded-full bg-amber-300/60";

    spoolL.style.animation = "none";
    spoolR.style.animation = "none";
    clearInterval(timer);
  }

  if (playBtn) {
    playBtn.onclick = function() {
      start();
    };
  }

  if (pauseBtn) {
    pauseBtn.onclick = function() {
      pause();
    };
  }

  if (stopBtn) {
    stopBtn.onclick = function() {
      pause();
      sec = 0;
      updateTimerText();
    };
  }

  if (rewBtn) {
    rewBtn.onclick = function() {
      sec = Math.max(0, sec - 15);
      updateTimerText();
    };
  }

  if (ffBtn) {
    ffBtn.onclick = function() {
      sec = Math.min(totalSec, sec + 30);
      updateTimerText();
    };
  }

  // Inject rotation keyframes if not present
  if (!document.getElementById("cassette-spin-style")) {
    var style = document.createElement("style");
    style.id = "cassette-spin-style";
    style.innerHTML = "@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }";
    document.head.appendChild(style);
  }
})();
</script>

</body>
</html>
