<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina Bento Personalizzata</title>
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    /* Reset base */
    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
    }
    /* Stili CSS Personalizzati */
    
  </style>
</head>
<body class="antialiased min-h-screen bg-[#11111b] text-[#cdd6f4]">
<!-- Card Frasario con Baloon da Dialogo -->
<div class="p-5 bg-white text-slate-900 border-2 border-slate-900 rounded-3xl shadow-[5px_5px_0px_0px_rgba(15,23,42,1)] flex flex-col justify-between min-h-[220px]">
  <div class="flex items-center justify-between border-b border-slate-200 pb-2">
    <span class="text-[10px] font-mono font-bold bg-amber-300 text-amber-950 px-2 py-0.5 rounded border border-amber-400">
      DIALOGO VIVO 💬
    </span>
    <span class="text-xs font-mono text-slate-500">Giapponese / Italiano</span>
  </div>

  <!-- Nuvoletta Baloon Fumetto con Beccuccio -->
  <div class="my-2 relative bg-amber-50 p-3.5 rounded-2xl border-2 border-slate-900 text-slate-900 shadow-xs">
    <div class="text-sm font-black">「初めまして、よろしくお願いします」</div>
    <div class="text-xs text-slate-600 mt-1 italic">"Piacere di conoscerti, conto sulla tua collaborazione."</div>
    <!-- Triangolino becco baloon in basso -->
    <div class="absolute -bottom-2.5 left-6 w-3 h-3 bg-amber-50 border-r-2 border-b-2 border-slate-900 rotate-45"></div>
  </div>

  <div class="pt-2 border-t border-slate-200 flex items-center justify-between text-xs font-mono">
    <span class="text-slate-500 text-[10px]">Livello: Base A1</span>
    <button class="px-3 py-1 bg-slate-950 hover:bg-slate-800 text-amber-300 font-bold rounded-xl transition cursor-pointer flex items-center gap-1 shadow-xs">
      <span>Ascolta</span> <span>🔊</span>
    </button>
  </div>
</div>
</body>
</html>
