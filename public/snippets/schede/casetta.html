<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina Bento Personalizzata</title>
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    /* Reset base */
    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
    }
    /* Stili CSS Personalizzati */
    
  </style>
</head>
<body class="antialiased min-h-screen bg-[#11111b] text-[#cdd6f4]">
<!-- Card Audiocassetta Retrò / Mini Music Player -->
<div class="p-5 bg-[#1e293b] text-white border-2 border-slate-900 rounded-3xl shadow-[5px_5px_0px_0px_rgba(15,23,42,1)] flex flex-col justify-between min-h-[220px]">
  <div class="flex items-center justify-between border-b border-slate-700 pb-2">
    <span class="text-xs font-mono font-bold text-amber-400 uppercase tracking-wider">CASSETTA // LATO A</span>
    <span class="text-[10px] font-mono text-emerald-400">● RIPRODUZIONE</span>
  </div>

  <!-- Finestra Bobine a Nastro al Centro -->
  <div class="my-2 p-3 bg-slate-950 rounded-2xl border border-slate-800 flex items-center justify-between">
    <!-- Bobina Sinistra -->
    <div class="w-8 h-8 rounded-full border-2 border-dashed border-amber-400 flex items-center justify-center text-xs animate-spin">
      ⚙
    </div>
    <!-- Nastro Centrale -->
    <div class="flex-1 mx-3 text-center">
      <div class="text-xs font-bold text-white truncate">Lo-Fi Study Beats #04</div>
      <div class="text-[10px] font-mono text-slate-400">02:45 / 04:12</div>
    </div>
    <!-- Bobina Destra -->
    <div class="w-8 h-8 rounded-full border-2 border-dashed border-amber-400 flex items-center justify-center text-xs animate-spin">
      ⚙
    </div>
  </div>

  <!-- Pulsanti Player a Scatto -->
  <div class="flex items-center justify-between pt-1">
    <span class="text-[10px] font-mono text-slate-400">STEREO 60 MIN</span>
    <div class="flex items-center gap-1.5 font-mono text-xs">
      <button class="px-3 py-1 rounded-lg bg-amber-400 text-slate-950 font-bold hover:bg-amber-300 transition cursor-pointer">
        ▶ PLAY
      </button>
      <button class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">
        ❚❚
      </button>
    </div>
  </div>
</div>
</body>
</html>
