<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
   <!-- Frame Tablet iPad Landscape con Dock Laterale -->
    <div class="col-span-1 sm:col-span-2 lg:col-span-4 p-4 bg-slate-950 border-4 border-slate-800 rounded-[2.5rem] shadow-2xl flex flex-col justify-between min-h-[420px] relative overflow-hidden">
      <!-- Bordo Cornice Superiore con Fotocamera Tablet -->
      <div class="flex items-center justify-center pb-2 shrink-0">
        <div class="w-3 h-3 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center">
          <span class="w-1 h-1 rounded-full bg-slate-950"></span>
        </div>
      </div>
    
      <!-- Schermo Tablet Widescreen con Barra Laterale e Canvas -->
      <div class="flex-1 w-full bg-slate-900 rounded-2xl border border-slate-800 flex overflow-hidden shadow-inner">
        <!-- Dock Laterale App -->
        <div class="w-14 bg-slate-950/90 border-r border-slate-800 p-2 flex flex-col justify-between items-center py-4 shrink-0">
          <div class="space-y-3">
            <div class="w-9 h-9 rounded-xl bg-amber-400 text-slate-950 font-bold flex items-center justify-center text-sm shadow-md cursor-pointer hover:scale-110 transition">
              ★
            </div>
            <div class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center text-sm cursor-pointer hover:scale-110 transition">
              📊
            </div>
            <div class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-purple-400 flex items-center justify-center text-sm cursor-pointer hover:scale-110 transition">
              🎨
            </div>
          </div>
          <div class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-xs">
            ⚙️
          </div>
        </div>
    
        <!-- Area Canvas Principale Tablet -->
        <div class="flex-1 p-6 flex flex-col justify-between text-white">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
              <span class="text-[10px] font-mono text-cyan-400 font-bold uppercase tracking-wider">TABLET CANVAS 16:10</span>
              <h3 class="text-xl font-black text-white">Spazio di Lavoro Panoramico</h3>
            </div>
            <span class="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 font-mono text-xs border border-emerald-500/30">
              Touch & Pen Pronto
            </span>
          </div>
    
          <div class="my-auto py-6 text-center space-y-2">
            <div class="text-3xl">🖊️</div>
            <p class="text-sm text-slate-300 max-w-md mx-auto">
              Incornicia le tue interfacce per tablet, fogli di calcolo o tavole da disegno in un vero dispositivo widescreen.
            </p>
          </div>
    
          <div class="flex items-center justify-between pt-3 border-t border-slate-800 text-xs font-mono text-slate-400">
            <span>Risoluzione 2560 × 1600</span>
            <span class="text-cyan-400">Interfaccia Multi-Finestra</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
