<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lavagna d'Ardesia Naturale - Componente Tailwind CSS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-[#faf9f6] text-stone-900 min-h-screen flex items-center justify-center p-6 sm:p-12">

<!-- =========================================================================
     LAVAGNA D'ARDESIA NATURALE (HTML + TAILWIND CSS + VANILLA JS CANVAS)
     Disegno reale con gessetti colorati, cancellino in feltro, post-it e pulisci lavagna
     ========================================================================= -->
<div id="lavagna-card" class="max-w-md w-full rounded-2xl p-4 sm:p-5 shadow-2xl relative select-none border-4 bg-[#4a3224] border-[#6b4731] text-amber-50">
  <!-- Cornice Superiore con Targhetta in Ottone -->
  <div class="flex items-center justify-between pb-2 px-1 border-b border-[#5e3e2c]">
    <div class="flex items-center gap-1.5">
      <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-tr from-amber-700 via-amber-300 to-amber-600 border border-amber-900 shadow-xs"></span>
      <span class="px-2.5 py-0.5 rounded bg-gradient-to-r from-amber-600 via-amber-300 to-amber-600 text-stone-950 font-mono font-black text-[9px] uppercase tracking-wider border border-amber-800 shadow-xs">
        ★ ARDESIA NATURALE • OFFICINA DESIGN
      </span>
    </div>
    <button id="chalk-toggle-notes" type="button" class="text-[9px] font-mono font-bold px-2 py-0.5 bg-[#3a2519] hover:bg-[#523524] rounded text-amber-200 border border-amber-700/40 cursor-pointer">
      NOTE: VISIBILI
    </button>
  </div>

  <!-- Piano in Ardesia Naturale con Canvas di Disegno -->
  <div class="relative h-64 sm:h-72 w-full rounded-xl overflow-hidden border-2 border-[#121c16] shadow-inner mt-2"
       style="background-color: #16241c; background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1.5px, transparent 1.5px); background-size: 20px 20px;">
    <!-- Canvas HTML5 per Disegno col Gesso -->
    <canvas id="chalk-canvas" class="absolute inset-0 w-full h-full cursor-crosshair z-10 touch-none"></canvas>

    <!-- Post-it Giallo con Puntina 3D -->
    <div id="chalk-sticky-note" class="absolute top-3 left-3 w-36 p-3 rounded-lg bg-amber-100 border border-amber-300 text-stone-900 shadow-xl -rotate-2 z-20 transition-opacity pointer-events-auto">
      <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-rose-600 border-2 border-white shadow-md"></div>
      <p class="text-[9px] font-black uppercase text-amber-900 pt-1">DESIGN IDEA</p>
      <p class="text-xs font-serif font-bold mt-0.5 text-stone-950 leading-tight">Disegna col gesso o usa il cancellino!</p>
      <span class="text-[9px] font-mono text-stone-600 mt-1 block">Sara M.</span>
    </div>

    <!-- Suggerimento Fluttuante in Basso -->
    <div class="absolute bottom-2 right-2 z-20 px-2 py-0.5 rounded bg-black/60 backdrop-blur-xs text-[9px] font-mono text-stone-300 pointer-events-none">
      Trascina per disegnare col gesso
    </div>
  </div>

  <!-- Vaschetta Portagessi 3D in Legno Scuro & Cancellino in Feltro -->
  <div class="mt-2.5 rounded-xl bg-[#2b1b11] border-2 border-[#543825] p-2.5 flex flex-wrap items-center justify-between gap-2 shadow-inner">
    <!-- Selezione Gessetti Colorati 3D -->
    <div class="flex items-center gap-1.5">
      <span class="text-[8px] font-mono font-bold text-amber-300 uppercase mr-1">GESSI:</span>
      <button type="button" data-color="#ffffff" class="chalk-btn w-4 h-9 rounded-sm bg-white border-2 border-amber-300 shadow-md transition-transform scale-110 active:scale-95 cursor-pointer" title="Gesso Bianco"></button>
      <button type="button" data-color="#fef08a" class="chalk-btn w-4 h-9 rounded-sm bg-yellow-200 border border-stone-400 shadow-md transition-transform hover:scale-105 active:scale-95 cursor-pointer" title="Gesso Giallo"></button>
      <button type="button" data-color="#7dd3fc" class="chalk-btn w-4 h-9 rounded-sm bg-sky-300 border border-stone-400 shadow-md transition-transform hover:scale-105 active:scale-95 cursor-pointer" title="Gesso Ciano"></button>
      <button type="button" data-color="#fda4af" class="chalk-btn w-4 h-9 rounded-sm bg-rose-300 border border-stone-400 shadow-md transition-transform hover:scale-105 active:scale-95 cursor-pointer" title="Gesso Rosa"></button>
      <button type="button" data-color="#86efac" class="chalk-btn w-4 h-9 rounded-sm bg-emerald-300 border border-stone-400 shadow-md transition-transform hover:scale-105 active:scale-95 cursor-pointer" title="Gesso Menta"></button>
    </div>

    <!-- Strumenti: Cancellino in Feltro & Pulisci Lavagna -->
    <div class="flex items-center gap-2">
      <button id="chalk-eraser-btn" type="button" class="px-2.5 py-1.5 rounded-lg bg-[#422918] hover:bg-[#5c3e27] border border-[#69442a] text-amber-100 font-mono text-[10px] font-bold uppercase transition-all shadow-xs cursor-pointer flex items-center gap-1">
        <span>CANCELLINO</span>
      </button>
      <button id="chalk-clear-btn" type="button" class="px-2 py-1.5 rounded-lg bg-red-950/70 hover:bg-red-900 border border-red-800/60 text-red-200 font-mono text-[10px] font-bold transition-all shadow-xs cursor-pointer">
        PULISCI
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById("chalk-canvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var isDrawing = false;
  var lastPos = null;
  var currentColor = "#ffffff";
  var isEraser = false;

  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      canvas.width = rect.width;
      canvas.height = rect.height;
      drawSampleSketch();
    }
  }

  function drawSampleSketch() {
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.font = 'bold 15px "Plus Jakarta Sans", sans-serif';
    ctx.fillText("UI Lab & Design System", 60, 65);

    ctx.strokeStyle = "#fef08a";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(60, 75);
    ctx.lineTo(260, 75);
    ctx.stroke();

    ctx.strokeStyle = "rgba(125, 211, 252, 0.8)";
    ctx.lineWidth = 2;
    ctx.strokeRect(60, 95, 100, 50);

    ctx.fillStyle = "rgba(125, 211, 252, 0.6)";
    ctx.fillRect(70, 105, 30, 6);
    ctx.fillRect(70, 117, 60, 5);
    ctx.fillRect(70, 127, 40, 5);

    ctx.restore();
  }

  function getCoords(e) {
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function start(e) {
    e.preventDefault();
    isDrawing = true;
    lastPos = getCoords(e);
  }

  function draw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    var p = getCoords(e);
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (isEraser) {
      ctx.strokeStyle = "#16241c";
      ctx.lineWidth = 24;
      ctx.beginPath();
      ctx.moveTo(lastPos.x, lastPos.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(lastPos.x, lastPos.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    ctx.restore();
    lastPos = p;
  }

  function stop() {
    isDrawing = false;
    lastPos = null;
  }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("mouseup", stop);
  canvas.addEventListener("mouseleave", stop);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", draw, { passive: false });
  canvas.addEventListener("touchend", stop);

  // Gessi Colorati
  var chalkButtons = document.querySelectorAll(".chalk-btn");
  chalkButtons.forEach(function(btn) {
    btn.onclick = function() {
      isEraser = false;
      currentColor = this.getAttribute("data-color");
      chalkButtons.forEach(function(b) {
        b.className = b.className.replace("scale-110 border-amber-300 border-2", "border-stone-400 border");
      });
      this.className = this.className.replace("border-stone-400 border", "scale-110 border-amber-300 border-2");
    };
  });

  // Cancellino
  var eraserBtn = document.getElementById("chalk-eraser-btn");
  if (eraserBtn) {
    eraserBtn.onclick = function() {
      isEraser = !isEraser;
      this.classList.toggle("bg-amber-600");
    };
  }

  // Pulisci Lavagna
  var clearBtn = document.getElementById("chalk-clear-btn");
  if (clearBtn) {
    clearBtn.onclick = function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
  }

  // Toggle Note
  var notesBtn = document.getElementById("chalk-toggle-notes");
  var stickyNote = document.getElementById("chalk-sticky-note");
  if (notesBtn && stickyNote) {
    notesBtn.onclick = function() {
      var isHidden = stickyNote.style.display === "none";
      stickyNote.style.display = isHidden ? "block" : "none";
      notesBtn.textContent = isHidden ? "NOTE: VISIBILI" : "NOTE: NASCOSTE";
    };
  }

  setTimeout(resizeCanvas, 50);
  window.addEventListener("resize", resizeCanvas);
})();
</script>

</body>
</html>
