<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto Tailwind CSS</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  


  <!-- Tailwind CSS Config -->
  <script>
    
window.tailwind = window.tailwind || {};
window.module = window.module || { exports: {} };
window.exports = window.exports || {};
try {
  // Configurazione Tailwind
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: '#0ea5e9',
      }
    }
  }
}
  if (window.module && window.module.exports && Object.keys(window.module.exports).length > 0) {
    window.tailwind.config = window.module.exports;
  }
} catch(e) {
  console.warn('Errore esecuzione tailwind.config:', e.message);
}
    if (window.tailwind && window.tailwind.config && !window.tailwind.config.darkMode) {
      window.tailwind.config.darkMode = 'class';
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>

  <!-- Custom CSS & Tailwind Directives -->
  
</head>
<body class="bg-[#0b0f19] text-[#f1f5f9] min-h-screen bg-[#1f1d1a] text-neutral-900 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans">


<div class="w-full max-w-xl mx-auto select-none p-2 sm:p-4 font-sans">
  <div class="relative bg-gradient-to-b from-[#e8e4dc] via-[#ded9cf] to-[#c7c0b3] rounded-3xl p-4 sm:p-6 shadow-2xl border-4 border-[#8c8475] text-neutral-800">
    
    <!-- Flash Overlay -->
    <div id="flash-overlay" class="hidden absolute inset-0 bg-white z-50 rounded-3xl opacity-90 pointer-events-none transition-opacity"></div>

    <!-- Barra Superiore: Mirino, Flash e Scatto -->
    <div class="flex items-center justify-between pb-3 mb-4 border-b-2 border-neutral-300">
      <div class="flex items-center gap-2">
        <div class="relative w-10 h-7 rounded-md bg-neutral-950 border-2 border-neutral-700 shadow-inner flex items-center justify-center">
          <div class="w-5 h-4 rounded-xs border border-white/40 bg-neutral-800 flex items-center justify-center">
            <span class="text-[7px] text-emerald-400 font-mono">+</span>
          </div>
        </div>
        <div class="w-14 h-7 rounded-md bg-neutral-200 border-2 border-neutral-400 shadow-inner flex items-center justify-center p-1">
          <div class="w-full h-full bg-gradient-to-r from-amber-100 via-white to-amber-100 rounded-xs flex items-center justify-around">
            <div class="w-1.5 h-3 bg-neutral-300 rounded-xs"></div>
            <div class="w-2 h-4 bg-amber-200 rounded-xs"></div>
            <div class="w-1.5 h-3 bg-neutral-300 rounded-xs"></div>
          </div>
        </div>
        <span class="hidden sm:inline-block px-2.5 py-0.5 rounded-full bg-neutral-800 text-amber-200 text-[10px] font-mono font-bold">
          INSTANT-1980
        </span>
      </div>

      <div class="flex items-center gap-2">
        <button id="snap-btn" type="button" class="relative w-10 h-10 rounded-full bg-gradient-to-b from-rose-500 to-rose-700 text-white flex items-center justify-center shadow-lg border-2 border-rose-900 cursor-pointer active:scale-95 transition-transform" title="Scatta">
          📷
        </button>
      </div>
    </div>

    <!-- Fessura di Espulsione -->
    <div class="relative mb-4">
      <div class="w-full h-3 bg-neutral-950 rounded-md border-y border-neutral-700 shadow-inner flex items-center justify-between px-3">
        <div class="flex h-1.5 w-16 rounded-xs overflow-hidden">
          <div class="w-1/4 bg-red-500"></div>
          <div class="w-1/4 bg-amber-400"></div>
          <div class="w-1/4 bg-emerald-500"></div>
          <div class="w-1/4 bg-sky-500"></div>
        </div>
        <span class="text-[8px] font-mono font-bold text-neutral-400 uppercase tracking-widest">
          SLOT PELLICOLA 600
        </span>
      </div>
    </div>

    <!-- Foto Polaroid con Bordo Bianco -->
    <div id="polaroid-card" class="relative mx-auto max-w-sm transition-transform duration-500">
      <div class="bg-[#fcfbf9] rounded-lg p-3 sm:p-4 pb-6 shadow-2xl border border-neutral-300 transform -rotate-1">
        <div class="relative aspect-square w-full rounded bg-neutral-950 overflow-hidden shadow-inner">
          <img id="photo-img" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Foto" class="w-full h-full object-cover contrast-105 saturate-135">
          <div id="photo-date" class="absolute bottom-2 right-2 font-mono text-[10px] font-black text-amber-400 drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">
            '14 AGO 1984
          </div>
        </div>
        <div class="mt-3 px-1">
          <p id="photo-caption" class="font-serif italic text-base text-neutral-800">
            Tramonto d'Agosto a Favignana
          </p>
        </div>
      </div>
    </div>

    <!-- Barra Controlli -->
    <div class="mt-4 pt-3 border-t border-neutral-300 flex items-center justify-between text-xs text-neutral-600">
      <div class="flex items-center gap-1.5">
        <button id="prev-btn" type="button" class="px-2.5 py-1 rounded-lg bg-neutral-200 hover:bg-neutral-300 font-semibold cursor-pointer">◀ Prev</button>
        <span id="counter" class="font-mono font-bold text-neutral-700">1 / 3</span>
        <button id="next-btn" type="button" class="px-2.5 py-1 rounded-lg bg-neutral-200 hover:bg-neutral-300 font-semibold cursor-pointer">Next ▶</button>
      </div>
      <button id="snap-secondary-btn" type="button" class="px-3 py-1 rounded-lg bg-neutral-800 text-white font-semibold cursor-pointer">✨ Scatta</button>
    </div>

  </div>
</div>

<script>
(function initPolaroid() {
  const photos = [
    { url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80', title: "Tramonto d'Agosto a Favignana", date: "'14 AGO 1984" },
    { url: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80', title: "Passeggiata nei Boschi di Querce", date: "'03 OTT 1986" },
    { url: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80', title: "Prima Neve sulle Vette", date: "'28 DIC 1989" }
  ];
  let idx = 0;

  const photoImg = document.getElementById('photo-img');
  const photoDate = document.getElementById('photo-date');
  const photoCaption = document.getElementById('photo-caption');
  const counter = document.getElementById('counter');
  const flashOverlay = document.getElementById('flash-overlay');
  const polaroidCard = document.getElementById('polaroid-card');

  function update() {
    photoImg.src = photos[idx].url;
    photoDate.textContent = photos[idx].date;
    photoCaption.textContent = photos[idx].title;
    counter.textContent = (idx + 1) + ' / ' + photos.length;
  }

  function triggerSnap() {
    flashOverlay.classList.remove('hidden');
    setTimeout(() => {
      flashOverlay.classList.add('hidden');
      polaroidCard.classList.add('translate-y-2');
      setTimeout(() => polaroidCard.classList.remove('translate-y-2'), 600);
    }, 200);
  }

  document.getElementById('snap-btn')?.addEventListener('click', triggerSnap);
  document.getElementById('snap-secondary-btn')?.addEventListener('click', triggerSnap);

  document.getElementById('next-btn')?.addEventListener('click', () => {
    idx = (idx + 1) % photos.length;
    update();
  });
  document.getElementById('prev-btn')?.addEventListener('click', () => {
    idx = (idx - 1 + photos.length) % photos.length;
    update();
  });
})();
</script>



</body>
</html>
