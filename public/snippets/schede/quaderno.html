<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto Tailwind CSS</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  


  <!-- Tailwind CSS Config -->
  <script>
    
window.tailwind = window.tailwind || {};
window.module = window.module || { exports: {} };
window.exports = window.exports || {};
try {
  // Configurazione Tailwind
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: '#0ea5e9',
      }
    }
  }
}
  if (window.module && window.module.exports && Object.keys(window.module.exports).length > 0) {
    window.tailwind.config = window.module.exports;
  }
} catch(e) {
  console.warn('Errore esecuzione tailwind.config:', e.message);
}
    if (window.tailwind && window.tailwind.config && !window.tailwind.config.darkMode) {
      window.tailwind.config.darkMode = 'class';
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>

  <!-- Custom CSS & Tailwind Directives -->
  
</head>
<body class="bg-[#0b0f19] text-[#f1f5f9] min-h-screen bg-[#1f1913] text-neutral-900 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans">


<div class="w-full max-w-xl mx-auto select-none p-2 sm:p-4 font-sans">
  <div class="relative flex shadow-2xl rounded-r-3xl rounded-l-lg overflow-visible">
    
    <!-- Retro Copertina Hardboard Cuoio con Asola Portapenna -->
    <div class="absolute -inset-1.5 bg-gradient-to-r from-amber-950 via-amber-900 to-amber-950 rounded-r-3xl rounded-l-md -z-10 shadow-2xl border border-amber-950/60 flex items-center justify-end pr-2">
      <div class="w-3 h-16 rounded-r-md bg-amber-700/80 border border-amber-600 shadow-inner flex items-center justify-center">
        <div class="w-1.5 h-12 rounded-full bg-gradient-to-b from-neutral-300 via-amber-400 to-neutral-800 shadow"></div>
      </div>
    </div>

    <!-- Colonna Dorso a Spirale Metallica 3D con 5 Anelli e Fori Punzonati -->
    <div class="w-14 sm:w-16 bg-gradient-to-r from-neutral-800 via-neutral-900 to-neutral-850 shrink-0 rounded-l-md border-r border-neutral-700/50 flex flex-col justify-between py-6 items-center z-20 shadow-md">
      <!-- Anello 1 -->
      <div class="relative flex items-center justify-center w-full my-1">
        <div class="absolute right-0 w-3.5 h-3.5 bg-neutral-950 rounded-full shadow-inner border border-neutral-800"></div>
        <div class="relative w-8 h-4 bg-gradient-to-b from-neutral-200 via-neutral-400 to-neutral-600 rounded-full shadow-lg border border-white/60 -mr-2 transform -rotate-6">
          <div class="absolute inset-x-1 top-0.5 h-1 bg-white/70 rounded-full"></div>
        </div>
      </div>
      <!-- Anello 2 -->
      <div class="relative flex items-center justify-center w-full my-1">
        <div class="absolute right-0 w-3.5 h-3.5 bg-neutral-950 rounded-full shadow-inner border border-neutral-800"></div>
        <div class="relative w-8 h-4 bg-gradient-to-b from-neutral-200 via-neutral-400 to-neutral-600 rounded-full shadow-lg border border-white/60 -mr-2 transform -rotate-6">
          <div class="absolute inset-x-1 top-0.5 h-1 bg-white/70 rounded-full"></div>
        </div>
      </div>
      <!-- Anello 3 -->
      <div class="relative flex items-center justify-center w-full my-1">
        <div class="absolute right-0 w-3.5 h-3.5 bg-neutral-950 rounded-full shadow-inner border border-neutral-800"></div>
        <div class="relative w-8 h-4 bg-gradient-to-b from-neutral-200 via-neutral-400 to-neutral-600 rounded-full shadow-lg border border-white/60 -mr-2 transform -rotate-6">
          <div class="absolute inset-x-1 top-0.5 h-1 bg-white/70 rounded-full"></div>
        </div>
      </div>
      <!-- Anello 4 -->
      <div class="relative flex items-center justify-center w-full my-1">
        <div class="absolute right-0 w-3.5 h-3.5 bg-neutral-950 rounded-full shadow-inner border border-neutral-800"></div>
        <div class="relative w-8 h-4 bg-gradient-to-b from-neutral-200 via-neutral-400 to-neutral-600 rounded-full shadow-lg border border-white/60 -mr-2 transform -rotate-6">
          <div class="absolute inset-x-1 top-0.5 h-1 bg-white/70 rounded-full"></div>
        </div>
      </div>
      <!-- Anello 5 -->
      <div class="relative flex items-center justify-center w-full my-1">
        <div class="absolute right-0 w-3.5 h-3.5 bg-neutral-950 rounded-full shadow-inner border border-neutral-800"></div>
        <div class="relative w-8 h-4 bg-gradient-to-b from-neutral-200 via-neutral-400 to-neutral-600 rounded-full shadow-lg border border-white/60 -mr-2 transform -rotate-6">
          <div class="absolute inset-x-1 top-0.5 h-1 bg-white/70 rounded-full"></div>
        </div>
      </div>
    </div>

    <!-- Foglio a Righe con Margine Rosso -->
    <div class="w-full min-w-0 flex-1 bg-[#fffdf0] rounded-r-2xl p-5 sm:p-7 pt-5 relative overflow-hidden text-neutral-900 border-l border-amber-200/60">
      
      <!-- Margine Rosso Verticale -->
      <div class="absolute left-8 sm:left-10 inset-y-0 w-0.5 bg-rose-400/70 pointer-events-none"></div>

      <!-- Post-it Giallo con Nastro Adesivo Scotch -->
      <div class="absolute top-3 right-4 sm:right-6 w-36 sm:w-44 bg-gradient-to-br from-amber-200 via-yellow-200 to-amber-300 text-amber-950 p-2.5 rounded shadow-lg transform rotate-2 z-10 border border-yellow-300/60">
        <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-14 h-4 bg-white/70 border border-white/80 shadow-xs rotate-[-3deg]"></div>
        <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-amber-900/70 mb-1">
          <span>📝 Memo</span>
          <span>📌</span>
        </div>
        <input id="notebook-sticky-note" type="text" value="💡 Ricorda: release venerdì!" class="w-full bg-transparent text-xs font-semibold text-amber-950 focus:outline-none border-b border-amber-400/40" />
      </div>

      <!-- Intestazione Data -->
      <div class="pl-6 sm:pl-8 pr-40 flex items-center justify-between gap-2 mb-3 text-xs text-amber-800 font-semibold">
        <span id="notebook-date">📅 Oggi • Note di Lavoro</span>
      </div>

      <!-- Titolo Pagina -->
      <div class="pl-6 sm:pl-8 mb-2">
        <input 
          id="notebook-title-input" 
          type="text" 
          value="Appunti di Architettura & UI" 
          class="w-full font-bold text-lg sm:text-xl text-neutral-900 border-b border-amber-300/80 pb-1.5 bg-transparent focus:outline-none"
        />
      </div>

      <!-- Foglio Righellato con Righe di Quaderno Interattivo -->
      <div class="pl-6 sm:pl-8 relative mb-2">
        <textarea 
          id="notebook-ruled-editor"
          rows="6"
          class="w-full text-neutral-800 text-xs sm:text-sm leading-7 py-2 bg-transparent focus:outline-none resize-none"
          style="background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(59, 130, 246, 0.25) 28px); line-height: 28px;"
        >1. Modularity: Dividere le responsabilità in moduli isolati.
2. Single Responsibility: Ogni componente fa una sola cosa bene.
3. DRY: Non ripetere mai logica identica.
4. Craftsmanship: Cura meticolosa di forma, colore e spaziatura.</textarea>
      </div>

      <!-- Piè di Pagina -->
      <div class="pl-6 sm:pl-8 pt-3 mt-2 border-t border-amber-200/60 flex items-center justify-between text-[11px] text-neutral-500">
        <div id="notebook-word-counter">32 parole • 218 caratteri</div>
        <div class="font-serif italic text-amber-800 text-[10px]">✦ Quaderno Spirale Premium</div>
      </div>

    </div>

  </div>
</div>

<script>
(function initNotebook() {
  const editor = document.getElementById('notebook-ruled-editor');
  const counterEl = document.getElementById('notebook-word-counter');
  const titleEl = document.getElementById('notebook-title-input');
  const stickyEl = document.getElementById('notebook-sticky-note');

  function update() {
    const text = editor ? editor.value : '';
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const chars = text.length;
    if (counterEl) {
      counterEl.textContent = words + ' parole • ' + chars + ' caratteri';
    }
  }

  editor?.addEventListener('input', update);
  update();
})();
</script>




</body>
</html>
