<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e242c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #272f3a;
      border: 1px solid #374353;
      border-radius: 12px;
      width: 100%;
      max-width: 320px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #f59e0b;
    }
    .card-banner {
      height: 120px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    .card-content {
      padding: 20px;
    }
    .card-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #f59e0b;
      margin-bottom: 8px;
    }
    .card-title {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #e2e8f0;
      font-weight: 600;
    }
    .card-desc {
      margin: 0 0 18px 0;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #374353;
      padding-top: 14px;
    }
    .card-price {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
    }
    .card-btn {
      background: #f59e0b;
      color: #1e242c;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .card-btn:hover {
      background: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-banner">📦</div>
    <div class="card-content">
      <span class="card-tag">Nuovo Arrivo</span>
      <h3 class="card-title">Kit Componenti Web</h3>
      <p class="card-desc">Raccolta di elementi UI leggeri e accessibili già ottimizzati per la resa.</p>
      <div class="card-footer">
        <span class="card-price">€29,00</span>
        <button class="card-btn">Acquista</button>
      </div>
    </div>
  </div>
</body>
</html>
