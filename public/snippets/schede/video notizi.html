
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Presentazione Video di Notizie</title>
  <style>

.container {
  display: flex;
  flex-wrap: wrap;
}

.news {
  width: 300px;
  margin: 20px;
  padding: 10px;
  text-align: center;
  background-color: #F1F1F1;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.news video {
  width: 100%;
  height: auto;
  margin-bottom: 10px;
}

.news h2 {
  margin: 10px 0;
}

.news p {
  margin: 0;
}
</style>
</head>
<body>
  
  <div class="container">
    <div class="news" id="news1">
      <video src="video1.mp4" controls></video>
      <h2>Titolo Notizia 1</h2>
      <p>Descrizione della Notizia 1</p>
    </div>
    <div class="news" id="news2">
      <video src="video2.mp4" controls></video>
      <h2>Titolo Notizia 2</h2>
      <p>Descrizione della Notizia 2</p>
    </div>
    <div class="news" id="news3">
      <video src="video3.mp4" controls></video>
      <h2>Titolo Notizia 3</h2>
      <p>Descrizione della Notizia 3</p>
    </div>
  </div>

</body>
</html>
