<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
    }
    .card-container {
      perspective: 1000px;
      width: 320px;
      height: 190px;
      cursor: pointer;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
    }
    .card.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      border-radius: 16px;
      text-align: center;
    }
    .card-front {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
    }
    .card-back {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid #e2e8f0;
      transform: rotateY(180deg);
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .term {
      font-size: 24px;
      font-weight: 800;
      margin: 4px 0;
    }
    .translation {
      font-size: 20px;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 6px;
    }
    .example {
      font-size: 13px;
      color: #64748b;
      font-style: italic;
    }
    .hint {
      font-size: 11px;
      margin-top: 10px;
      opacity: 0.8;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      background: #0f172a;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #334155;
    }
  </style>
</head>
<body>

  <div class="card-container" onclick="flipCard()">
    <div class="card" id="flashcard">
      <div class="card-face card-front">
        <span class="badge">Phrasal Verb #1</span>
        <div class="term" id="term-text">Bring up</div>
        <div class="hint">Clicca per scoprire il significato</div>
      </div>
      <div class="card-face card-back">
        <span class="badge" style="background:#e0e7ff; color:#3730a3;">Significato</span>
        <div class="translation" id="trans-text">Sollevare un argomento</div>
        <div class="example" id="example-text">"I will bring up this issue in the meeting."</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="prevCard(event)">⬅ Precedente</button>
    <button onclick="nextCard(event)">Successivo ➡</button>
  </div>

  <script>
    const cards = [
      { term: "Bring up", trans: "Sollevare un argomento", ex: '"I will bring up this issue in the meeting."' },
      { term: "Call off", trans: "Annullare definitivamente", ex: '"They decided to call off the call."' },
      { term: "Put off", trans: "Posticipare / Rinviare", ex: '"Let us put off the presentation to Friday."' },
      { term: "Wrap up", trans: "Concludere una sessione", ex: '"Let us wrap up with key action points."' }
    ];
    let currentIndex = 0;
    const cardEl = document.getElementById('flashcard');

    function flipCard() {
      cardEl.classList.toggle('is-flipped');
    }

    function updateCard() {
      cardEl.classList.remove('is-flipped');
      setTimeout(() => {
        document.getElementById('term-text').innerText = cards[currentIndex].term;
        document.getElementById('trans-text').innerText = cards[currentIndex].trans;
        document.getElementById('example-text').innerText = cards[currentIndex].ex;
      }, 150);
    }

    function nextCard(e) {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % cards.length;
      updateCard();
    }

    function prevCard(e) {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      updateCard();
    }
  </script>
</body>
</html>
